  --shadow: 7px;
  --shadow-density: 25%;

  --pixel-size: 3;
  --field-cell: 6;
  --field-ink: 6.1%;

  --dur-move: 280ms;
  --dur-reveal: 500ms;
  --dur-screen: 580ms;
  --dur-develop: 420ms;
  --dur-decode: 460ms;
  --glitch: 28;
  --intro-hold: 3780ms;
  --check-duration: 18000ms;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {

    --page: #050505;

    --fill: #161614;

    --ink-3: #6F6D66;

<script>
/* Fonts load without blocking the page. The list comes from the --font-css token; offline, the stacks' system fallbacks take over. */
window.loadFonts = function () {
  var css = getComputedStyle(document.documentElement).getPropertyValue('--font-css');
  var urls = (css.match(/"[^"]+"/g) || []).map(function (s) { return s.slice(1, -1); });
  var seen = window.FONT_LINKS || (window.FONT_LINKS = {});
  return Promise.race([Promise.all(urls.map(function (href) {
    if (!seen[href]) seen[href] = new Promise(function (done) {
      var link = document.createElement('link');
      link.rel = 'stylesheet'; link.href = href; link.onload = link.onerror = done;
      document.head.appendChild(link);
    });
    return seen[href];
  })), new Promise(function (done) { setTimeout(done, 1500); })]);
};
window.FONTS_CSS = window.loadFonts();
</script>
<script>
/* Runs before first paint: theme + motion preference, and the dither tiles every texture is cut from.
   One rule for the whole style: solid ink is what a source reported; dithered ink is interpretation, process or noise. */
(function () {
  var root = document.documentElement;
  try {
    var theme = localStorage.getItem('nexgen-theme');
    if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
    if (localStorage.getItem('nexgen-motion') === 'calm') root.classList.add('calm');
  } catch (e) {}
  // 8×8 ordered (Bayer) threshold matrix.
  var B = [0,32,8,40,2,34,10,42, 48,16,56,24,50,18,58,26, 12,44,4,36,14,46,6,38, 60,28,52,20,62,30,54,22,
           3,35,11,43,1,33,9,41, 51,19,59,27,49,17,57,25, 15,47,7,39,13,45,5,37, 63,31,55,23,61,29,53,21];
  // A crisp SVG tile: cells whose threshold is below `level` (0–64) are opaque. `invert` gives the exact complement.
  function tile(level, cell, invert) {
    var d = '';
    for (var y = 0; y < 8; y++) for (var x = 0; x < 8; x++) {
      if ((B[y * 8 + x] < level) !== !!invert) d += 'M' + x * cell + ' ' + y * cell + 'h' + cell + 'v' + cell + 'h-' + cell + 'z';
    }
    var s = 8 * cell;
    return 'url("data:image/svg+xml,' + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='" + s + "' height='" + s +
      "' shape-rendering='crispEdges'><path d='" + (d || 'M0 0') + "'/></svg>") + '")';
  }
  // Texture tiles follow the dither tokens: --dither-cell (pixel size) and --shadow-density (shadows only).
  function ditherTiles() {
    var cs = getComputedStyle(root);
    var cell = Math.max(1, Math.round(parseFloat(cs.getPropertyValue('--dither-cell')) || 2));
    var shadow = Math.round((parseFloat(cs.getPropertyValue('--shadow-density')) || 25) * .64);
    [6, 12, 19, 25, 38, 50, 62, 75].forEach(function (p) { root.style.setProperty('--dit-' + p, tile(Math.round(p * .64), cell)); });
    root.style.setProperty('--dit-shadow', tile(shadow, cell));
    root.style.setProperty('--dit-big', tile(shadow, cell + 1));
  }
  window.DITHER = { B: B, tile: tile, refresh: ditherTiles };
  ditherTiles();
  // Serif and sans display faces want different leading and tracking: say which one the display token is.
  window.displayKind = function () {
    root.dataset.display = /sans-serif\s*$/.test(getComputedStyle(root).getPropertyValue('--serif').trim()) ? 'sans' : 'serif';
  };
  window.displayKind();
})();
</script>
<style>
/* ───────────────────────── Signal: 1-bit newsprint, one hot channel ───────────────────────── */
/* Colours, type, layout, dither and motion values are tokens (see the tokens block above). Easings stay here. */
:root{--out:cubic-bezier(.16,1,.3,1); --snap:cubic-bezier(.3,1.5,.5,1)}
*{box-sizing:border-box}
html,body{height:100%;overscroll-behavior-x:none}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  font-synthesis-style:none}  /* a face without italics stays upright instead of being slanted by the browser */
button,input,textarea{font:inherit;color:inherit}
::selection{background:var(--signal);color:var(--on-signal)}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes blink{50%{opacity:0}}
@keyframes march{to{-webkit-mask-position:var(--dither-cell) 0;mask-position:var(--dither-cell) 0}}
.dither{-webkit-mask:var(--dit-25);mask:var(--dit-25)}

/* ───────── Stage: living field, walkthrough rail, device, notes ───────── */
#field{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none;z-index:0}
.stage{position:relative;z-index:1;display:grid;grid-template-columns:232px 390px 248px;gap:44px;justify-content:center;
  align-items:start;min-height:100%;padding:32px 16px}
.rail{position:sticky;top:32px;display:flex;flex-direction:column;gap:20px;background:var(--page);box-shadow:0 0 0 16px var(--page)}
.wordmark{display:flex;align-items:center;gap:9px;font:600 calc(var(--size-label) + 1.5px)/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;margin:0}
.wordmark i{width:10px;height:10px;background:var(--signal);flex:none;animation:blink 1.4s steps(1) infinite}
.rail .sub{font:400 var(--size-label)/1.5 var(--mono);color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin:-12px 0 0 19px}
.rail .act{font:500 var(--size-label)/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 8px;
  display:flex;align-items:center;gap:10px}
.rail .act::after{content:"";flex:1;height:3px;background:var(--ink);opacity:.5;-webkit-mask:var(--dit-25);mask:var(--dit-25)}
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.rail li button{position:relative;width:100%;text-align:left;background:none;border:0;border-radius:var(--radius-control);padding:8px 10px;font:500 calc(var(--size-body) - 2px)/1.2 var(--ui);
  color:var(--ink-2);cursor:pointer;display:flex;gap:12px;align-items:baseline;transition:color calc(var(--dur-micro)*.9375) steps(2)}
.rail li button>*{position:relative}
.rail li button::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--ink);opacity:0;-webkit-mask:var(--dit-19);mask:var(--dit-19);
  transition:opacity calc(var(--dur-micro)*1.25) steps(3)}
.rail li button:hover::before{opacity:.55}
.rail li button:hover{color:var(--ink)}
.rail li button .n{font:500 var(--size-label) var(--mono);color:var(--ink-3);width:18px;flex:none;letter-spacing:.04em}
/* The active step is an ink cursor that slides between steps; the label inverts once it arrives. */
.rail-cursor{position:absolute;left:0;top:0;width:0;height:0;background:var(--ink);border-radius:var(--radius-control);pointer-events:none;opacity:0;
  transition:transform var(--dur-move) var(--out),width var(--dur-move) var(--out),height var(--dur-move) var(--out),opacity var(--dur-micro) steps(2)}
.rail-cursor.on{opacity:1}
.rail-cursor.still{transition:none}
.rail li button[aria-current="step"]{background:none;color:var(--screen);transition:color var(--dur-micro) steps(2) calc(var(--dur-move)*.35)}
.rail li button[aria-current="step"]::before{opacity:0}
.rail li button[aria-current="step"] .n{color:var(--signal)}
.rail li button[aria-current="step"]::after{content:"";position:relative;width:7px;height:13px;margin-left:auto;align-self:center;
  background:var(--signal);animation:blink 1s steps(1) infinite}
.tools{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.tools .label{font:500 calc(var(--size-label) - .5px)/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
.seg{display:flex;border:var(--line-weight) solid var(--ink);border-radius:var(--radius-control);overflow:hidden}
.seg button{flex:1;background:none;border:0;padding:7px 0;font:500 var(--size-label)/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;color:var(--ink-2);transition:background-color calc(var(--dur-micro)*1.125) steps(3),color calc(var(--dur-micro)*1.125) steps(3)}
.seg button+button{border-left:var(--line-weight) solid var(--ink)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--screen)}
.tools .links{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.tools .links button,.tools .links label{background:none;border:0;padding:0;cursor:pointer;font:500 calc(var(--size-label) + .5px)/1 var(--mono);letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.tools .links button:hover,.tools .links label:hover{color:var(--signal)}
.tools input[type=checkbox]{appearance:none;-webkit-appearance:none;width:11px;height:11px;margin:0;border:var(--line-weight) solid currentColor;display:grid;place-items:center}
.tools input[type=checkbox]:checked{background:var(--signal);border-color:var(--signal)}
.notes{position:sticky;top:32px;font-size:calc(var(--size-body) - 3px);line-height:1.55;color:var(--ink-2);display:flex;flex-direction:column;gap:12px;background:var(--page);box-shadow:0 0 0 16px var(--page)}
.notes h2{font:500 var(--size-label)/1 var(--mono);color:var(--ink-3);letter-spacing:.14em;text-transform:uppercase;margin:0;display:flex;gap:10px;align-items:center}
.notes h2::after{content:"";flex:1;height:3px;background:var(--ink);opacity:.5;-webkit-mask:var(--dit-25);mask:var(--dit-25)}
.notes ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.notes li{padding-left:16px;position:relative}
.notes li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;background:var(--ink)}
.notes .motion li::before{background:var(--signal)}
.notes[hidden]{display:none}

.device-wrap{position:relative}
.device-wrap::before{content:"";position:absolute;left:0;top:0;width:var(--device-shadow-w,0);height:var(--device-shadow-h,0);background:var(--ink);
  -webkit-mask:var(--device-shadow) 0 0/100% 100% no-repeat;mask:var(--device-shadow) 0 0/100% 100% no-repeat;opacity:.9}
.device{position:relative;width:390px;height:min(844px,calc(100vh - 64px));background:var(--screen);border-radius:var(--radius-device);
  outline:var(--line-weight) solid var(--ink);overflow:hidden;display:flex;flex-direction:column;isolation:isolate}
@media (max-width:980px){
  #field{display:none}
  .stage{grid-template-columns:minmax(0,1fr);padding:0;gap:0}
  .rail{position:static;padding:10px 16px;background:var(--page);gap:8px;min-width:0;box-shadow:none}
  .wordmark,.rail .sub,.rail .act,.tools,.notes{display:none}
  #steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .rail ol{flex-direction:row;gap:6px;flex:none}
  .rail li button{white-space:nowrap;padding:7px 10px;border:var(--line-weight) solid var(--ink);font-size:calc(var(--size-body) - 3px)}
  .rail li button[aria-current="step"]::after{display:none}
  .rail-cursor{display:none}
  .rail li button[aria-current="step"]{background:var(--ink)}
  .device-wrap::before{display:none}
  .device{width:100%;height:calc(100vh - 54px);height:calc(100dvh - 54px);border-radius:0;outline:0}
  /* For now, phones show the app alone (clean screen recordings): no walkthrough steps. Delete these two rules to bring them back. */
  .rail{display:none}
  .device{height:100vh;height:100dvh}
  html,body{background:var(--screen)}
}

/* On the site the prototype is the app alone, at every screen size: no walkthrough rail, notes or field. On phones it fills the screen. */
.rail,.notes,#field{display:none}
.stage{grid-template-columns:390px;padding:32px 16px}
@media (max-width:980px){.stage{grid-template-columns:minmax(0,1fr);padding:0}}

/* ───────── App chrome: bar, live strip, viewport ───────── */
.bar{position:relative;display:flex;align-items:center;gap:10px;height:54px;padding:0 var(--gutter);border-bottom:var(--line-weight) solid var(--line);flex:none;z-index:4;background:var(--screen);
  overflow:hidden;transition:height var(--dur-reveal) var(--out),border-color var(--dur-micro) steps(2)}
/* Onboarding screens have no bar: it folds away and comes back when the app proper begins. */
.bar.gone{height:0;border-bottom-width:0}
.bar .title{font:500 calc(var(--size-label) + .5px)/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .brand{display:flex;align-items:center;gap:9px;font:600 calc(var(--size-label) + 1px)/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;flex:1}
.bar .brand i{width:9px;height:9px;background:var(--signal);animation:blink 1.4s steps(1) infinite}
.bar .link{font:500 var(--size-label)/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:8px 11px;border:var(--line-weight) solid var(--ink);border-radius:var(--radius-control);
  background:none;cursor:pointer;transition:background-color var(--dur-micro) steps(3),color var(--dur-micro) steps(3)}
.bar .link:hover,.bar .link.is-hover{background:var(--ink);color:var(--screen)}
.bar .progress{position:absolute;left:0;right:0;bottom:calc(-1 * var(--line-weight));height:2px;background:var(--signal);transform-origin:0 50%;transform:scaleX(var(--p,0))}

.strip{position:relative;z-index:3;flex:none;display:flex;align-items:center;gap:10px;height:44px;padding:0 var(--gutter);overflow:hidden;
  border-bottom:var(--line-weight) solid var(--line);background:var(--fill);color:var(--ink-2);font:500 var(--size-label)/1.25 var(--mono);letter-spacing:.07em;text-transform:uppercase;
  transition:height var(--dur-reveal) var(--out),background-color calc(var(--dur-move)*1.142857) steps(4),color calc(var(--dur-move)*1.142857) steps(4),border-color calc(var(--dur-micro)*1.25)}
.strip.shut{height:0;border-bottom-color:transparent}
.strip .wave{width:44px;height:16px;flex:none;image-rendering:pixelated;display:block;
  transition:width var(--dur-reveal) var(--out),margin var(--dur-reveal) var(--out),opacity var(--dur-micro) steps(2)}
.strip .pip{width:0;height:9px;flex:none;margin-right:-10px;opacity:0;background:var(--on-signal);animation:blink .9s steps(1) infinite;
  transition:width var(--dur-reveal) var(--out),margin var(--dur-reveal) var(--out),opacity var(--dur-micro) steps(2)}
.strip .text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* A line too long for the strip (the sources it found) glides through instead of being cut off. */
.strip .text.scrolls{text-overflow:clip;-webkit-mask:linear-gradient(90deg,#000 88%,transparent);mask:linear-gradient(90deg,#000 88%,transparent);will-change:transform}
.strip .text.scrolls span{will-change:transform}
.strip .text span{display:inline}
.strip .text.scrolls span{display:inline-block}
.strip .steps{display:flex;gap:3px;flex:none;width:62px;overflow:hidden;
  transition:width var(--dur-reveal) var(--out),margin var(--dur-reveal) var(--out),opacity var(--dur-micro) steps(2)}
.strip .steps i{width:10px;height:6px;flex:none;background:var(--ink);-webkit-mask:var(--dit-25);mask:var(--dit-25);transition:background-color calc(var(--dur-move)*1.071429) steps(3)}
.strip .steps i.now{-webkit-mask:var(--dit-50);mask:var(--dit-50);background:var(--signal);animation:march .35s steps(1) infinite}
.strip .steps i.on{-webkit-mask:none;mask:none;background:var(--signal)}
.strip .go{flex:none;border:0;border-radius:var(--radius-control);background:var(--on-signal);color:var(--signal);padding:8px 13px;font:600 var(--size-label)/1 var(--mono);letter-spacing:.14em;
  text-transform:uppercase;cursor:pointer;display:none;transition:transform calc(var(--dur-micro)*1.25) var(--out)}
.strip .go:hover{transform:translateX(-2px)}
.strip.ready{background:var(--signal);color:var(--on-signal);border-bottom-color:var(--signal)}
.strip.ready .wave{width:0;margin-right:-10px;opacity:0}
.strip.ready .steps{width:0;margin-left:-10px;opacity:0}
.strip.ready .pip{width:9px;margin-right:0;opacity:1}
.strip.ready .go{display:block}
.strip.shut{height:0;border-bottom-width:0}
.strip.ready .go{animation:pop var(--dur-reveal) var(--out) both calc(var(--dur-micro)*.75)}
@keyframes pop{from{transform:translateX(8px);opacity:0}}

.viewport{position:relative;flex:1;min-height:0;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;background:var(--screen);scrollbar-width:none;touch-action:pan-y}
.view::-webkit-scrollbar{display:none}
.view.instant *{transition:none!important}
.fringe{position:absolute;inset:0;z-index:5;pointer-events:none;background:var(--signal);opacity:0}
/* Each screen sits in a carrier. During a sweep the carrier holds the dither band as a fixed mask and slides; the
   screen inside slides back by the same amount, so it stays put. */
.view-wrap{position:absolute;inset:0}
.spark{position:absolute;left:0;top:0;bottom:0;width:64px;z-index:5;pointer-events:none;background:var(--signal);will-change:transform}
.fx{position:absolute;inset:0;z-index:20;pointer-events:none;width:100%;height:100%;image-rendering:pixelated}
.floater{position:absolute;z-index:15;pointer-events:none;image-rendering:pixelated;transform-origin:0 0}
.pad{position:relative;padding:28px var(--gutter) 72px;display:flex;flex-direction:column;gap:var(--section-gap)}
.pad.roomy{gap:calc(var(--section-gap) + 8px)}
.pad.pad-full{padding:0;height:100%;gap:0}
.ghost{position:absolute!important;margin:0!important;pointer-events:none;z-index:1}

/* Intro: noise resolving into the wordmark */
.boot{position:absolute;inset:0;z-index:30;background:var(--screen);display:grid;place-items:center;cursor:pointer}
.boot canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.boot .cap{position:absolute;left:0;right:0;bottom:56px;text-align:center;font:500 var(--size-label)/1.6 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);opacity:0}
.boot .cap b{color:var(--signal);font-weight:500}

/* ───────── Type ───────── */
.eyebrow{font:500 var(--size-label)/1.3 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin:0}
.h1{font:400 var(--size-display)/1.04 var(--serif);letter-spacing:-.012em;margin:0;text-wrap:balance}
.h1 .w{display:inline-block}
.h2{font:400 var(--size-headline)/1.16 var(--serif);letter-spacing:-.004em;margin:0;text-wrap:balance}
.h2.sub{font-size:calc(var(--size-headline) - 3px)}
.h3{font:600 calc(var(--size-body) - 2px)/1.35 var(--ui);margin:0}
.body{font-size:var(--size-body);line-height:1.55;margin:0}
.small{font-size:calc(var(--size-body) - 1.5px);line-height:1.5;color:var(--ink-2);margin:0}
.meta{font:400 calc(var(--size-label) + .5px)/1.5 var(--mono);letter-spacing:.03em;color:var(--ink-3);margin:0}
.section{display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec-label{display:flex;align-items:center;gap:10px}
.sec-label::after{content:"";flex:1;height:3px;background:var(--ink);opacity:.35;-webkit-mask:var(--dit-25);mask:var(--dit-25)}

/* A sans display face (the --serif token set to a grotesk) gets a touch more leading and tighter tracking at display
   sizes; a serif keeps the values above. */
[data-display="sans"] .h1{line-height:1.08;letter-spacing:-.024em}
[data-display="sans"] .h2{line-height:1.2;letter-spacing:-.012em}
[data-display="sans"] .lede-h{line-height:1.16;letter-spacing:-.02em}
[data-display="sans"] .ask-said{line-height:1.2;letter-spacing:-.018em}
.body,.small,.file-text,.ev blockquote{text-wrap:pretty}

/* ───────── Components ───────── */
.card{position:relative;z-index:0;display:flex;flex-direction:column;gap:10px;padding:var(--card-pad);border:var(--line-weight) solid var(--line);border-radius:var(--radius-card);background:var(--screen);text-align:left}
button.card{width:100%;cursor:pointer;border-color:var(--ink);background:none;transition:transform var(--dur-move) var(--out)}
button.card::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--screen);border-radius:inherit}
button.card::after{content:"";position:absolute;inset:calc(-1 * var(--line-weight));z-index:-2;background:var(--ink);-webkit-mask:var(--dit-shadow);mask:var(--dit-shadow);
  border-radius:inherit;transform:translate(var(--shadow),var(--shadow));transition:transform var(--dur-move) var(--out)}
button.card:hover,button.card.is-hover{transform:translate(-2px,-2px)}
button.card:hover::after,button.card.is-hover::after{transform:translate(calc(var(--shadow) + 3px),calc(var(--shadow) + 3px))}
button.card:active{transform:translate(3px,3px);transition-duration:calc(var(--dur-micro)*.4375)}
button.card:active::after{transform:translate(0,0);transition-duration:calc(var(--dur-micro)*.4375)}
.card .top{display:flex;gap:14px;align-items:flex-start;justify-content:space-between}
.card .top>.stack{flex:1;min-width:0}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chev{width:22px;height:10px;flex:none;position:relative;overflow:hidden}
.chev::before{content:"";position:absolute;right:0;top:4px;width:22px;height:2px;background:var(--ink);transition:transform calc(var(--dur-reveal)*.7) var(--out)}
.chev::after{content:"";position:absolute;right:0;top:1px;width:8px;height:8px;border-top:calc(2 * var(--line-weight)) solid var(--ink);border-right:calc(2 * var(--line-weight)) solid var(--ink);
  transform:rotate(45deg) translate(-1px,1px);transform-origin:center}
button.card .chev::before{transform:scaleX(.45);transform-origin:100% 50%}
button.card:hover .chev::before,button.card.is-hover .chev::before{transform:scaleX(1)}
.fp{display:block;image-rendering:pixelated;flex:none}
.fp.thumb{width:56px;height:56px}
.fp.mini{width:40px;height:40px}
.hero{position:relative;margin:-20px calc(-1 * var(--gutter)) 0;height:156px;border-bottom:var(--line-weight) solid var(--line);overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.hero .lab{position:absolute;display:flex;gap:6px;font:500 calc(var(--size-label) - .5px)/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.hero .lab span{background:var(--screen);padding:5px 7px;border-radius:var(--radius-control);border:var(--line-weight) solid var(--ink)}
.hero .lab span.hot{background:var(--signal);border-color:var(--signal);color:var(--on-signal)}
.hero .lab.bl{left:var(--gutter);bottom:12px}
.hero .lab.tr{right:var(--gutter);top:12px}

.tag{display:inline-flex;align-items:center;gap:6px;font:500 calc(var(--size-label) - .5px)/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  padding:5px 7px;border:var(--line-weight) solid var(--ink);border-radius:var(--radius-control);color:var(--ink);white-space:nowrap;position:relative}
.tag.strong{background:var(--ink);color:var(--screen)}
.tag.signal{background:var(--signal);border-color:var(--signal);color:var(--on-signal)}
.tag.signal::before{content:"";width:5px;height:5px;background:currentColor;animation:blink 1s steps(1) infinite}
.tag.accent{background:var(--signal-soft);border-color:var(--signal);color:var(--ink)}
.tag.outline,.tag.dot{border-color:transparent}
.tag.outline::after,.tag.dot::after{content:"";position:absolute;inset:calc(-1 * var(--line-weight));background:var(--ink);border-radius:inherit;
  -webkit-mask:var(--dit-50),linear-gradient(#000 0 0) content-box;mask:var(--dit-50),linear-gradient(#000 0 0) content-box;
  -webkit-mask-composite:source-out;mask-composite:subtract;padding:var(--line-weight);pointer-events:none}
.tag.quiet{border-color:transparent;color:var(--ink-3);padding-left:0}
.tag.wrap{white-space:normal;line-height:1.4;text-align:left}

.btn{position:relative;z-index:0;border:0;padding:17px 18px;font:600 calc(var(--size-body) - .5px)/1 var(--ui);cursor:pointer;width:100%;background:var(--ink);color:var(--screen);border-radius:var(--radius-control);
  display:flex;justify-content:space-between;align-items:center;transition:transform calc(var(--dur-move)*.892857) var(--out),color calc(var(--dur-micro)*1.25) steps(2)}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--signal);border-radius:inherit;transform:scaleX(0);transform-origin:0 50%;transition:transform var(--dur-reveal) var(--out)}
.btn::after{content:"";position:absolute;inset:0;z-index:-2;background:var(--ink);-webkit-mask:var(--dit-shadow);mask:var(--dit-shadow);border-radius:inherit;transform:translate(var(--shadow),var(--shadow));transition:transform calc(var(--dur-move)*.892857) var(--out)}
.btn:hover,.btn.is-hover{color:var(--on-signal)}
.btn:hover::before,.btn.is-hover::before{transform:scaleX(1)}
.btn:active{transform:translate(3px,3px);transition-duration:calc(var(--dur-micro)*.4375)}
.btn:active::after{transform:translate(0,0)}
.btn .arr{font:500 calc(var(--size-label) + 2.5px)/1 var(--mono);letter-spacing:.06em;transition:transform calc(var(--dur-reveal)*.7) var(--out)}
.btn:hover .arr,.btn.is-hover .arr{transform:translateX(4px)}
.btn.quiet{background:none;color:var(--ink);border-radius:0;padding:6px 0;width:auto;font:500 calc(var(--size-label) + .5px)/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  justify-content:flex-start;gap:8px;text-align:left;border-bottom:var(--line-weight) solid var(--ink);align-self:flex-start}
.btn.quiet::before,.btn.quiet::after{display:none}
/* A running check turns its button into a local progress bar: label, live percentage, a signal line along the foot. */
/* A running check holds its button: the label says so and the arrow becomes the strip's marching segment. */
.btn.is-busy{cursor:progress}
.btn.is-busy:hover,.btn.is-busy.is-hover{color:var(--screen)}
.btn.is-busy:hover::before,.btn.is-busy.is-hover::before{transform:scaleX(0)}
.btn.is-busy:hover .arr,.btn.is-busy.is-hover .arr{transform:none}
.btn .seg{display:block;width:16px;height:6px;background:var(--signal);-webkit-mask:var(--dit-50);mask:var(--dit-50);animation:march .35s steps(1) infinite}
.btn.quiet:hover{color:var(--signal);border-color:var(--signal)}

.field{position:relative;display:flex;flex-direction:column;gap:8px}
.field label{font:500 var(--size-label)/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.field::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--signal);transform:scaleX(0);transform-origin:0 50%;transition:transform calc(var(--dur-reveal)*1.2) var(--out)}
.field:focus-within::after{transform:scaleX(1)}
textarea,input[type=text]{background:none;border:0;border-bottom:var(--line-weight) solid var(--ink);border-radius:0;width:100%;outline:none;caret-color:var(--signal)}
textarea{font:italic 400 calc(var(--size-quote) + 3px)/1.32 var(--serif);padding:4px 0 12px;resize:none}
input[type=text]{font-size:calc(var(--size-body) - 1px);padding:10px 0}

/* Four questions */
.q{display:flex;flex-direction:column;gap:10px;padding-top:18px;border-top:var(--line-weight) solid var(--line)}
.q:first-child{border-top:0;padding-top:0}
.q .qh{display:flex;gap:10px;align-items:center}
.q .num{font:600 calc(var(--size-label) - .5px)/1 var(--mono);width:24px;height:20px;display:grid;place-items:center;border:var(--line-weight) solid var(--ink);border-radius:var(--radius-control);flex:none;
  transition:background-color calc(var(--dur-move)*1.071429) steps(3),color calc(var(--dur-move)*1.071429) steps(3)}
.q.seen .num{background:var(--ink);color:var(--screen)}
.interp{position:relative;overflow:hidden;border-radius:var(--radius-card);background:var(--fill);padding:13px 14px 14px 22px;display:flex;flex-direction:column;gap:8px}
.interp::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--ink);-webkit-mask:var(--dit-38);mask:var(--dit-38)}
.ev{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:var(--line-weight) solid var(--line)}
.ev:first-child{border-top:0;padding-top:0}
.ev blockquote{margin:0;padding:1px 0 1px 13px;border-left:calc(2 * var(--line-weight)) solid var(--ink);font:italic 400 var(--size-quote)/1.38 var(--serif);color:var(--ink)}
.ev .mark{background:linear-gradient(var(--signal-soft),var(--signal-soft)) 0 0/0% 100% no-repeat;transition:background-size calc(var(--dur-reveal)*2.4) var(--out) calc(var(--dur-micro)*.9375)}
.ev.seen .mark{background-size:100% 100%}
.ev a,.src a{color:var(--ink);text-decoration:none;font:500 var(--size-label)/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;align-self:flex-start;
  border-bottom:var(--line-weight) solid currentColor;padding-bottom:2px}
.ev a:hover,.src a:hover{color:var(--signal)}
.src a{text-transform:none;letter-spacing:0;font:500 calc(var(--size-body) - 1.5px)/1.4 var(--ui);border-bottom-color:var(--line)}
.flag{color:var(--warn);font-weight:600}
.bullets{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:calc(var(--size-body) - .5px);line-height:1.5}
.bullets li{position:relative;padding-left:18px}
.bullets li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;background:var(--ink)}

/* Disclosure: height springs open, contents develop like a print */
.acc{border-top:var(--line-weight) solid var(--line)}
.acc:last-child{border-bottom:var(--line-weight) solid var(--line)}
.acc>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;background:none;border:0;cursor:pointer;
  font:600 calc(var(--size-body) - 1.5px)/1.3 var(--ui);text-align:left;transition:padding calc(var(--dur-move)*1.071429) var(--out)}
.acc>button:hover{padding-left:6px}
.acc .pm{width:11px;height:11px;position:relative;flex:none;transition:transform calc(var(--dur-reveal)*.9) var(--out)}
.acc .pm::before,.acc .pm::after{content:"";position:absolute;background:var(--ink);transition:transform calc(var(--dur-reveal)*.9) var(--out),background-color calc(var(--dur-micro)*1.25) steps(2)}
.acc .pm::before{left:0;right:0;top:5px;height:1.5px}
.acc .pm::after{top:0;bottom:0;left:5px;width:1.5px}
.acc>button:hover .pm::before,.acc>button:hover .pm::after{background:var(--signal)}
.acc.open .pm{transform:rotate(180deg)}
.acc.open .pm::after{transform:scaleY(0)}
.acc .region{overflow:hidden}
.acc .region[hidden]{display:none}
.acc .inner{padding:0 0 18px;display:flex;flex-direction:column;gap:12px}
.accordions{display:flex;flex-direction:column}

/* Feedback */
.fb{display:flex;flex-direction:column;gap:8px}
.fb .actions{display:flex;flex-wrap:wrap;gap:6px}
.fb .actions button{position:relative;border:var(--line-weight) solid var(--ink);border-radius:var(--radius-control);background:none;padding:9px 12px;font:500 calc(var(--size-body) - 2.5px)/1 var(--ui);cursor:pointer;
  transition:background-color var(--dur-micro) steps(3),color var(--dur-micro) steps(3),transform calc(var(--dur-micro)*1.25) var(--out)}
.fb .actions button:hover,.fb .actions button.is-hover{background:var(--ink);color:var(--screen)}
.fb .actions button:active{transform:scale(.95)}
.fb.compact .actions button{padding:7px 10px;font-size:calc(var(--size-body) - 3px)}
.fb .done{position:relative;overflow:hidden;border-radius:var(--radius-card);display:flex;flex-direction:column;gap:5px;background:var(--fill);padding:12px 14px 12px 18px}
.fb .done::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--signal)}
.fb .done .row{justify-content:space-between}
.fb .undo{background:none;border:0;cursor:pointer;font:500 var(--size-label)/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:0;border-bottom:var(--line-weight) solid currentColor}
.fb .undo:hover{color:var(--signal)}
.fb .note{display:flex;flex-direction:column;gap:10px}
.fb .note textarea{font:400 calc(var(--size-body) - .5px)/1.45 var(--ui);border:var(--line-weight) solid var(--ink);border-radius:var(--radius-control);padding:10px 12px}
.fb .note .actions button.primary{background:var(--ink);color:var(--screen)}
.fb .note .actions button.primary:hover{background:var(--signal);border-color:var(--signal);color:var(--on-signal)}

/* What you already know */
.knows{display:flex;flex-direction:column}
.knows .item{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:var(--line-weight) solid var(--line);overflow:hidden}
.knows .item .k{font:500 calc(var(--size-label) - .5px)/1.9 var(--mono);color:var(--ink-3);flex:none;width:20px}
.knows .item .t{flex:1;display:flex;flex-direction:column;gap:3px;font-size:calc(var(--size-body) - 1px);line-height:1.4}
.knows .item button{background:none;border:0;color:var(--ink-3);cursor:pointer;font:500 calc(var(--size-label) - .5px)/1.9 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:0}
.knows .item button:hover{color:var(--signal)}
.knows .add{display:flex;gap:10px;align-items:flex-end;margin-top:6px}
.knows .add button{flex:none;border:var(--line-weight) solid var(--ink);border-radius:var(--radius-control);background:none;padding:9px 14px;font:500 var(--size-label)/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;transition:background-color var(--dur-micro) steps(3),color var(--dur-micro) steps(3)}
.knows .add button:hover{background:var(--ink);color:var(--screen)}

.post{position:relative;border-radius:var(--radius-card);padding:14px;display:flex;flex-direction:column;gap:8px}
.post::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--ink);pointer-events:none;
  -webkit-mask:var(--dit-50),linear-gradient(#000 0 0) content-box;mask:var(--dit-50),linear-gradient(#000 0 0) content-box;
  -webkit-mask-composite:source-out;mask-composite:subtract;padding:2px}
.avatar{width:26px;height:26px;flex:none;background:var(--ink);-webkit-mask:var(--dit-50);mask:var(--dit-50)}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.list li{display:flex;flex-direction:column;gap:3px}
.list.ticks li{padding-left:18px;position:relative}
.list.ticks li::before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;background:var(--signal)}

/* ───────── Onboarding: full-height screens that breathe ───────── */
.full{position:relative;height:100%;display:flex;flex-direction:column;padding:0 var(--gutter);overflow:hidden}
.lede{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding:48px 10px 36px;text-align:center}
.lede-h{font:400 calc(var(--size-display) - 5px)/1.14 var(--serif);letter-spacing:-.01em;margin:0;text-wrap:balance;max-width:310px}
.lede-h .w{display:inline-block}
.lede-h .num{font-variant-numeric:tabular-nums}
.lede-eyebrow{font:500 var(--size-label)/1.3 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin:0}
.lede-note{font:400 calc(var(--size-label) + .5px)/1.6 var(--mono);letter-spacing:.03em;color:var(--ink-3);margin:0;max-width:280px}
.lede-link{background:none;border:0;padding:0 0 2px;cursor:pointer;font:500 var(--size-label)/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink);border-bottom:var(--line-weight) solid currentColor;transition:color var(--dur-micro) steps(2)}
.lede-link:hover{color:var(--signal)}
.lede-tag{display:inline-flex;align-items:center;gap:7px;padding:6px 9px;background:var(--signal);color:var(--on-signal);
  font:600 calc(var(--size-label) - .5px)/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;border-radius:var(--radius-control)}
.lede-tag::before{content:"";width:5px;height:5px;background:currentColor;animation:blink 1s steps(1) infinite}
.lede-tag[hidden]{display:none}

/* 1a · Ask: one living cluster, one question, one gesture. */
/* Three blocks in a column, so nothing overlaps: the cluster takes the space the words leave it. */
.orb-wrap{position:relative;flex:1 1 0;min-height:110px;margin:0 calc(-1 * var(--gutter))}
.orb{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
/* The prompt and your question share one cell sized to the larger of the two, and the question is laid out in full
   (invisible) before the first word arrives: words appear in place and never push each other or the page. */
.ask-copy{position:relative;display:grid;align-items:center;justify-items:center;text-align:center;padding:0 6px}
.ask-copy>*{grid-area:1/1}
.ask-said{position:relative;font:400 calc(var(--size-display) - 5px)/1.16 var(--serif);letter-spacing:-.01em;margin:0;text-wrap:balance;max-width:320px}
.ask-said .w{display:inline-block;transition:color calc(var(--dur-reveal)*1.2) steps(4)}
.ask-said .w.fresh,.ask-said .c.fresh{color:var(--signal)}
.ask-said .c{transition:color calc(var(--dur-reveal)*1.2) steps(4)}
.ask-said .wait{opacity:0}
.ask-said .caret{position:absolute;left:0;top:0;width:.42em;height:.86em;background:var(--signal);animation:blink .9s steps(1) infinite}
.ask-controls{display:flex;flex-direction:column;align-items:center;gap:4px;padding:34px 0 50px}
.mic{position:relative;width:68px;height:68px;border:0;border-radius:50%;background:none;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.mic::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--ink);opacity:0;-webkit-mask:var(--dit-19);mask:var(--dit-19);transition:opacity var(--dur-micro) steps(3)}
.mic:hover::before{opacity:.55}
.mic svg{position:relative;width:30px;height:30px;transition:color var(--dur-micro) steps(2),transform var(--dur-move) var(--out)}
.mic:active svg{transform:scale(.9)}
.mic .ring{position:absolute;inset:6px;border-radius:50%;border:2px solid var(--signal);-webkit-mask:var(--dit-50);mask:var(--dit-50);opacity:0;pointer-events:none}
.mic.listening{color:var(--signal);cursor:default}
.mic.listening::before{opacity:0}
.mic.listening .ring{animation:ring 1.8s var(--out) infinite}
.mic.listening .ring:nth-child(2){animation-delay:.6s}
.mic.listening .ring:nth-child(3){animation-delay:1.2s}
@keyframes ring{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.9);opacity:0}}
.kbd{width:40px;height:40px;border:0;background:none;color:var(--ink-3);cursor:pointer;display:grid;place-items:center;transition:color var(--dur-micro) steps(2)}
.kbd:hover{color:var(--ink)}
.kbd svg{width:20px;height:20px}

/* 1a · Thinking: the field is the message. */
.world{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;cursor:crosshair;touch-action:none}
.world-label{position:absolute;left:0;top:0;z-index:3;width:max-content;max-width:236px;padding:12px 14px 13px;border:var(--line-weight) solid var(--ink);
  border-radius:var(--radius-card);pointer-events:none;display:flex;flex-direction:column;gap:6px;opacity:0;transition:opacity calc(var(--dur-micro)*1.25) var(--out)}
.world-label.on{opacity:1;pointer-events:auto}
/* The label is its own stacking context, so its fill sits on a layer above the dithered shadow, as on cards. */
.world-label::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--screen);border-radius:inherit}
.world-label::after{content:"";position:absolute;inset:calc(-1 * var(--line-weight));z-index:-2;background:var(--ink);-webkit-mask:var(--dit-shadow);mask:var(--dit-shadow);
  transform:translate(var(--shadow),var(--shadow));border-radius:inherit}
.world-label[hidden]{display:none}
.world-label .k{font:500 var(--size-label)/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.world-label .t{font-size:calc(var(--size-body) - 1px);line-height:1.42;color:var(--ink)}
.world-cta{position:absolute;left:50%;bottom:46px;z-index:3;transform:translateX(-50%);display:flex;align-items:center;gap:12px;white-space:nowrap;
  padding:13px 16px;background:var(--ink);border:var(--line-weight) solid var(--ink);border-radius:var(--radius-control);cursor:pointer;
  font:500 var(--size-label)/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--screen);
  transition:background-color var(--dur-micro) steps(3),border-color var(--dur-micro) steps(3),color var(--dur-micro) steps(3)}
.world-cta:hover{background:var(--signal);border-color:var(--signal);color:var(--on-signal)}
.world-cta .arr{display:inline-block;transition:transform var(--dur-move) var(--out)}
.world-cta:hover .arr{transform:translateX(4px)}

/* Files: index tabs in a drawer. One line weight, staggered tabs, small type; solid file, dithered shadow. */
.file{--tab-h:22px;position:relative;z-index:0;display:block;width:100%;padding:0;border:0;background:none;color:var(--ink);text-align:left;font:inherit}
/* Hover and press use `translate`, which adds to a file's own transform: in a drawer that transform is its place in
   the stack, so feedback must never replace it. */
button.file{cursor:pointer;transition:translate var(--dur-move) var(--out)}
.file-shape{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;z-index:-1;pointer-events:none}
.file-shape path{fill:var(--screen);stroke:var(--ink);stroke-width:var(--line-weight);stroke-linejoin:round}
.file::after{content:"";position:absolute;left:0;right:0;top:var(--tab-h);bottom:0;z-index:-2;background:var(--ink);-webkit-mask:var(--dit-shadow);mask:var(--dit-shadow);
  border-radius:var(--radius-card);transform:translate(var(--shadow),var(--shadow));transition:transform var(--dur-move) var(--out)}
.file-tab{position:absolute;top:0;left:var(--tab-x,8px);height:var(--tab-h);display:flex;align-items:center;gap:9px;padding:1px 15px 0;white-space:nowrap;
  font:500 calc(var(--size-label) - 1px)/1 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);transition:color var(--dur-micro) steps(2)}
.file-tab b{font-weight:500;color:var(--ink)}
.file-tab i{font-style:normal;color:var(--ink-3)}
.file-body .lede-tag{align-self:flex-start}
.file.current .file-tab,.file:not(.in-drawer) .file-tab{color:var(--ink)}
.file-body{display:flex;flex-direction:column;gap:12px;padding:calc(var(--tab-h) + var(--card-pad) + 2px) var(--card-pad) var(--card-pad)}
.file-body .top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.file-body .top>.stack{flex:1;min-width:0;gap:10px}
.file-body .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
.file-text{font-size:calc(var(--size-body) - 1.5px);line-height:1.5;color:var(--ink-2);margin:0}
@media (hover:hover){
  button.file:not(.in-drawer):hover,button.file.current:hover{translate:-2px -2px}
  button.file:not(.in-drawer):hover::after,button.file.current:hover::after{transform:translate(calc(var(--shadow) + 3px),calc(var(--shadow) + 3px))}
  button.file:hover .chev::before{transform:scaleX(1)}
}
button.file .chev::before{transform:scaleX(.45);transform-origin:100% 50%}
button.file:active{translate:1.5px 1.5px;transition-duration:calc(var(--dur-micro)*.4375)}
.drawer button.file:not(.current):active{translate:none}  /* a tab tap brings the file up; it doesn't press it */

/* Clipped top and bottom only (the shadow falls to the side), so files waiting below the edge never add scroll length. */
.drawer{position:relative;flex:none;width:100%;user-select:none;-webkit-user-select:none;overflow-x:visible;overflow-y:clip}
.drawer .file{position:absolute;left:0;top:0;will-change:transform,clip-path}
.drawer .file::after{opacity:0;transition:transform var(--dur-move) var(--out),opacity var(--dur-move) var(--out)}
.drawer .file.current::after{opacity:1}
.drawer .file{pointer-events:none}
/* In a drawer, files overlap, so a file is hit only where it is drawn: its outline (tab and body), never the empty
   corner of its box beside the tab, which lies over its neighbours' tabs. */
.drawer .file .file-shape path{pointer-events:visiblePainted;cursor:pointer}
.drawer .file:not(.current):hover .file-tab{color:var(--ink)}
/* Inline (your question): the drawer is the page's last block and runs into the bottom padding, so its files leave
   through the bottom edge of the screen, as on the full-screen drawers. */
.drawer.inline{margin-bottom:-72px}


/* Sheet: sources, pulled up over the files */
.sheet-scrim{position:absolute;inset:0;z-index:90;background:var(--ink);opacity:0;-webkit-mask:var(--dit-50);mask:var(--dit-50);transition:opacity var(--dur-reveal) steps(4);pointer-events:none}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:91;max-height:82%;overflow:auto;background:var(--screen);border-top:var(--line-weight) solid var(--ink);
  padding:20px var(--gutter) 40px;transform:translateY(102%);transition:transform var(--dur-reveal) var(--out);display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
.sheet-wrap.open .sheet{transform:none}
.sheet-wrap.open .sheet-scrim{opacity:.12;pointer-events:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-wrap{position:absolute;inset:0;z-index:90;pointer-events:none}
.sheet-wrap.open{pointer-events:auto}
.drawer:not(.ready) .file{visibility:hidden}
.file .file-tab.hot{color:var(--signal)}
.lede-more{min-height:40px;display:flex;justify-content:center;align-items:flex-start}
.drawer-full,.files-full,.world-full,.ask-full{touch-action:none}
button.file.is-hover{translate:-2px -2px}
button.file.is-hover::after{transform:translate(calc(var(--shadow) + 3px),calc(var(--shadow) + 3px))}

/* TEMPORARY · touch indicator for screen recordings (see SHOW_TOUCHES). */
.touch-dot{position:fixed;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;pointer-events:none;z-index:9999;
  background:rgba(128,128,128,.32);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75),0 0 0 1px rgba(0,0,0,.08)}

/* Calm mode: same layout, no movement. */
html.calm *,html.calm *::before,html.calm *::after{animation-duration:0s!important;animation-iteration-count:1!important;transition-duration:0s!important;transition-delay:0s!important}

<script>
const D = {"plain":{"about":"Plain-language edition of committed analysis, for reading on a phone. Saved records are unchanged; quotes, sources and dates always come from the records. Every key must match a saved record id (checked by wireframes.py). Read entries may carry a short \"tab\" label for the file tab; it names the read's topic and adds no claim.","edited_by":{"mode":"claude-code-session","model":"claude-opus-5-5","date":"2026-10-08"},"knows":{"source":"Restates the context in inquiries.json (ai-design), which every analysis of this question received.","items":["A strong point of view matters.","Staged workflows lead to better work.","High-quality assets and careful final polish matter.","Judgment matters in design."]},"developments":{"figma-agent-ga":{"headline":"Figma's AI agent is out of beta, and reads your design rules","summary":"Since 6 October, teams can attach markdown files with design rules to a library. The agent reads them every time someone uses that library.","note":"Only Figma's own pages describe this so far."},"claude-design-ga":{"headline":"Claude Design is out of beta, on every plan including Free","summary":"Announced 8 October. Design has worked inside Claude conversations since 16 September, and a team's design systems move over in one step. The standalone site closes on 14 December."},"coinbase-code-connect-eval":{"headline":"Coinbase measured what design context saves","summary":"Published by Figma on 2 September. Linking Figma components to code cut an AI agent's cost and time by about 22%, across three runs of one design."},"context-research-background":{"headline":"Background we used","summary":"Earlier research in your question: a February study of written instruction files for coding AI, and a July NN/g article arguing that design context helps."}},"claims":{"claim-01f83be369575272":"Figma's AI agent is leaving beta.","claim-5fbb667e0d25878e":"Teams can add markdown rule files that the agent reads on every prompt.","claim-3fa8016cb041c074":"Figma advises writing rules as dos and don'ts for decisions people get wrong.","claim-a46e57a9d7bb84d4":"Claude Design is out of beta on every plan, including Free.","claim-033af1e5200685d0":"A team's design systems move into Claude in one step.","claim-ee9561b84e46b4e2":"Linking components to code cut the agent's cost and time by about 22%.","claim-9bcc4864f565bfa5":"The test used one design, one prompt and one model, three times.","claim-4057c66d161500a8":"Hand-written instruction files helped coding AI only a little.","claim-abd6ea602ec81f5a":"AI-written instruction files made results slightly worse.","claim-b5305db6eeffbc3e":"NN/g says curated context improves AI-made screens, without publishing data."},"reads":{"connection-b44acea7f4e29894":{"headline":"Your design rules now feed Figma's and Claude's AI. Only one kind has been tested","new":"Figma's AI agent left beta on 6 October. It now reads markdown files with your design rules on every prompt. Two days later, Claude Design left beta on every plan, and design systems can move into Claude in one step.","why":"You'll probably write and maintain these rule files. It helps to know where that effort has paid off in a test, and where nobody has checked yet.","missing":"The one real measurement, from Coinbase, linked Figma components directly to code. It cut AI cost and time by about 22%. That's not the same as a written rules file. When researchers tested written instruction files for coding AI, they barely helped, and AI-written ones made things slightly worse. So link components and tokens first, and test written rules before relying on them.","sure":["Coinbase ran one design three times, and Figma published the result.","It measured turning designs into code, not generating designs.","The research on written instruction files used coding tasks.","Neither Figma nor Anthropic has published whether their rule files improve results.","No independent news coverage was collected. Every source comes from the companies involved."],"check":"Ask Figma's agent for five screens with your guidelines file and five without, using the same prompts. Count how often each set breaks your design rules. Then try with only component links and tokens. If the written file clearly reduces mistakes, this read is wrong.","tab":"Rule files"},"connection-ae3deb0ca84c411a":{"headline":"AI design tools now start with AI's ideas, not yours","new":"Google's Stitch (March) and Anthropic's Claude Design (April) both begin by generating directions for you.","why":"Starting from AI ideas can feel better while making everyone's work more alike, so a gut check won't catch it. Sketch your own directions first, then use AI to expand or critique them.","missing":"A July 2026 study found AI-suggested ideas made people's work more alike, yet each person rated their own work higher. AI refining people's own ideas didn't have that effect. So when 91% of designers tell Figma that AI improves their work, that's what you'd expect either way.","sure":["The study looked at writing, not interface design.","No one has tested Stitch or Claude Design this way.","A 2024 study found the opposite when AI examples were shown differently.","Figma's 91% is a self-reported survey from a design-tool company."],"check":"On one real brief, make three directions yourself and three starting from AI. Ask two or three colleagues to sort them blind for how distinct they are. If the AI-first set is just as distinct, this concern is weaker.","tab":"Ideas first"},"connection-feea5602be496d04":{"headline":"Design rule files are becoming a deliverable. Test them before trusting them","new":"NN/g (July 2026) says design work is turning into files that AI tools read. Google opened up its DESIGN.md format in April.","why":"Your next important design asset may be a text file every AI tool reads. Keep it short, write it by hand, and check whether it actually improves what AI makes.","missing":"The only controlled test, on coding assistants, found hand-written instruction files helped only a little, and AI-written ones made results slightly worse. NN/g suggests drafting these files with AI help.","sure":["That test used coding tasks, not interface design.","NN/g says its own experiments show context helps, but hasn't published the data.","Design values like colours and spacing are precise, so they may help more than coding guidance.","DESIGN.md is still a draft."],"check":"Generate the same five screens three ways: with no rules file, with a hand-written DESIGN.md and with an AI-drafted one. Have someone rate them blind for fit with your design system. If the AI-drafted file does as well, or neither helps, drop this.","tab":"Rule files"},"connection-1213b6c2a4574ef1":{"headline":"Designers now ship code, and debugging is the skill most at risk","new":"In a 2026 survey of more than 900 designers, half say they've pushed AI-generated code to production.","why":"Design QA now includes checking that shipped code works, not just that it looks right. If you lead or mentor, keep some practice without AI on the tasks being automated, and keep a review step for code designers ship.","missing":"In Anthropic's study, people who learned a new coding library with AI did worst on debugging. The entry-level tasks where designers used to build judgment are also the ones AI now does.","sure":["That study looked at developers learning a library, not designers.","The survey doesn't define \"production\". It may mostly mean small copy or spacing fixes.","The same survey says AI coding makes designers feel more capable.","Some companies still have engineers review designer changes."],"check":"For a month, compare bug or revert rates for changes shipped by designers and by engineers. Ask designers to find a planted bug in their own recent change without AI. Equal rates and quick fixes would weaken this.","tab":"Debugging"},"connection-81cd655f43930a06":{"headline":"Where AI enters your process may matter more than the final polish","why":"You already start with a strong point of view. Even so, a strong position can get anchored to the first thing AI generates. Frame several directions yourself before looking at AI examples, and judge variety separately from polish.","missing":"Keep your own starting directions, then use AI to expand, challenge or refine them.","sure":["The studies used stories, metaphors and short tasks, not experienced product designers.","A large study found AI examples increased variety under some conditions.","Most participants in the fixation study weren't professionals."],"check":"On two similar briefs, compare starting with AI against starting with your own directions and refining with AI. Review both blind for quality and difference. If AI-first is just as distinct, drop this rule."},"connection-1766d08141938244":{"headline":"Three AI-written angles are not three people's views","why":"This questions how these lenses were built. Different labels can make one model's output feel like a range of opinions. Each lens has to bring a different question and different sources to be worth your time.","missing":"Real value would come from a person adding something the sources missed. That hasn't been tested yet.","sure":["The study behind this tested writing, not this app.","A P&G experiment found AI can give some benefits of teamwork in bounded tasks.","Simulated angles can still help you explore."],"check":"Give the same question and sources to a real designer and to someone from another field. Compare what they add with these lenses. If they only rephrase, the case for real contributors is still unproven."},"connection-e0d4854af7f3d6d6":{"headline":"A great AI-assisted result can hide that you couldn't check the next one","why":"When you adopt an unfamiliar workflow, a polished result doesn't show whether you'd spot the next broken one. A short critique without AI, on a deliberately flawed result, would show it.","missing":"Judge two things separately: the quality of the work, and what you can explain, diagnose or reject afterwards. They can move in different directions.","sure":["The main study was mostly junior engineers, not senior designers.","The other studies here are self-reported or observational.","Some people used AI to learn faster. How you use it matters."],"check":"After trying a new AI workflow, hide the assistant and ask the designer to find a planted error and explain a trade-off. Repeat a few weeks later. If they still catch it, the concern is weaker."},"connection-ba1409fa8e28b1fe":{"headline":"Faster, approved and understood are three different wins","why":"A team can finish more tasks while quietly adding review work, or while letting the AI approve its own output. Name the unit of work and who judges it.","missing":"Before handing work to AI, decide what success means on three separate counts: time and review effort, work someone else approves, and whether you can still evaluate it.","sure":["No tested combined score exists. You'd measure these yourself.","METR warns its slowdown result shouldn't be generalised.","A P&G study found real performance gains."],"check":"On one real task, log time, review time and rejected drafts. Have someone else judge it against criteria written in advance. Then check whether the maker can spot one flaw unaided. Keep the numbers separate."},"connection-92317b4ce3c3b348":{"headline":"Good memory keeps the reasons and what replaced them, not just more notes","why":"For a design team, a rejected idea or an expired assumption should stay findable without steering every new task. For this app, \"you explored this\" must stay different from \"you agreed with this\".","missing":"Record who decided, on what evidence, for what scope, and what later replaced it. Treat old reasoning as context you can revise, not as a rule.","sure":["The evidence comes from coding instruction files and memory benchmarks, not news or design teams.","Hand-written context files helped a little in one test.","Storing too little loses detail you need later."],"check":"Change one assumption you accepted earlier, note what replaces it, and ask a new question that depends on it. Check that the answer uses the new assumption and can still show the old reasoning."},"connection-8d54624eabc19011":{"headline":"A saved replay shows how this app works, not whether its memory does","why":"Saved paths make a walkthrough reliable, but they can't show that the app adapts to you or keeps someone else's meaning.","missing":"Test memory by changing something: correct a source, change the question or add a person's view, and see what the next update does differently.","sure":["The benchmark cited uses simulated users.","Static records are still useful for tracing and checking.","A real contributor might add nothing new. That would be a valid result."],"check":"Replay one path, then run the same question with a correction and look at what changed in the evidence. Later, repeat with a real person who agrees to take part."}},"update_notes":["None of the recent feed items was directly about your question, so we searched the web and found these sources.","Coinbase's own post and independent news coverage couldn't be collected. Every source here comes from the companies involved."]},"plain_missing":[],"inquiry":{"question":"What's genuinely changing in AI-native product design, and which connections could improve how I judge and build products?","title":"AI and my product-design practice"},"publishers":["The Verge","TechCrunch","Wired","Simon Willison's Weblog","Nielsen Norman Group","Google Blog","OpenAI"],"current":{"name":"ai-news-2026-10-08-design","run_id":"ai-design-5c3b83e66c79","created":"2026-10-09T02:07:08.677501+00:00","status":"analyzed","reading":{"sources":6,"words":14449,"paper_words":7746,"minutes":81},"publishers":["Anthropic","Figma","Figma Help Center","Gloaguen et al.","Nielsen Norman Group"],"question":"What's genuinely changing in AI-native product design, and which connections could improve how I judge and build products?","reads":[{"id":"connection-b44acea7f4e29894","key":"design-rules-ship-before-they-are-measured","title":"Design-rule files now ship in Figma and Claude, but only structured links have been measured","whats_new":"Figma's agent left beta on 6 October with markdown rule files it reads on every prompt. Claude Design left beta on 8 October on every plan, with design systems migrating into Claude.","why":"You will likely write and maintain these rule files. This tells you where effort has shown a measured return so far, and where it has not been tested.","thesis":"Interpretation. Two major design tools now treat a team's design rules as input their AI reads. The one measured case, Coinbase, tested structured links between Figma components and code, not prose rules, and found lower cost and time. Controlled research on prose instruction files found little or negative effect. If that pattern holds, structured links and tokens deserve effort first, and prose guideline files should be tested before teams rely on them.","gap":"Neither Figma nor Anthropic publishes a measurement of whether its rule files or design systems improve AI output. No independent coverage of either launch was collected.","missing":"Coinbase's test was three runs of one design, published by Figma, and measured code generation rather than design generation. The coding-agent research measured software tasks. Nothing here measures Figma guidelines or Claude design systems directly.","counter":"Figma's help article says guidelines capture what the agent cannot infer from library assets. NN/g reports that curated context improves AI-generated UI, without published data. Coinbase also notes that agents get better at its design system with each new model.","next":"Run the Figma agent on five screens with and without your guidelines file, same prompts, and count design-rule violations. Repeat with only component links and tokens. If the prose file clearly cuts violations, revise this read.","freshness":"changed-evidence","supersedes":["connection-feea5602be496d04"],"evidence":[{"id":"claim-5fbb667e0d25878e","statement":"The same release adds library guidelines: markdown rule files the agent reads on every prompt that uses the library.","quote":"These files are read by the agent every time a user prompts with the library enabled","kind":"reported-finding","event":"figma-agent-ga-2026-10","source":{"id":"figma-agent-ga","url":"https://www.figma.com/release-notes/","title":"The Figma agent is generally available","publisher":"Figma","published":"2026-10-06","kind":"vendor-announcement","reading_depth":"full-article","status":"ok","origin":"figma-agent-ga-2026-10","batch":"news-2026-10","found_via":"Found by session web search on 8 Oct 2026; not in the permitted feeds.","older":false}},{"id":"claim-033af1e5200685d0","statement":"Anthropic says one migration brings an organisation's design systems into Claude.","quote":"One migration brings over every design system in your organization","kind":"reported-finding","event":"claude-design-ga-2026-10","source":{"id":"claude-design-ga","url":"https://claude.com/resources/articles/dashboards-and-motion","title":"Build live dashboards and animate explainers with Claude","publisher":"Anthropic","published":"2026-10-08","kind":"vendor-announcement","reading_depth":"full-article","status":"ok","origin":"claude-design-ga-2026-10","batch":"news-2026-10","found_via":"Found by session web search on 8 Oct 2026; not in the permitted feeds.","older":false}},{"id":"claim-ee9561b84e46b4e2","statement":"Coinbase's design-system team reports that linking Figma components to code cut agent cost by 22.5% and time by 22.3%.","quote":"it cut token use by 11.5%, time to implementation by 22.3%, and cost by 22.5%","kind":"reported-finding","event":"coinbase-code-connect-eval-2026","source":{"id":"figma-coinbase-code-connect","url":"https://www.figma.com/blog/how-coinbase-used-code-connect-to-sh
