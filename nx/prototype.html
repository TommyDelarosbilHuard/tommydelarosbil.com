ve benefit for coding agents.","trail":[{"id":"figma-agent-ga","url":"https://www.figma.com/release-notes/","title":"The Figma agent is generally available","publisher":"Figma","published":"2026-10-06","kind":"vendor-announcement","reading_depth":"full-article","status":"ok","origin":"figma-agent-ga-2026-10","batch":"news-2026-10","found_via":"Found by session web search on 8 Oct 2026; not in the permitted feeds.","older":false,"disposition":"used","reason":"Primary release note for the 6 Oct launch; vendor source."},{"id":"figma-library-guidelines","url":"https://help.figma.com/hc/en-us/articles/43509372175511-Add-guidelines-files-to-a-design-library","title":"Add guidelines files to a design library","publisher":"Figma Help Center","published":null,"kind":"vendor-documentation","reading_depth":"full-article","status":"ok","origin":"figma-agent-ga-2026-10","batch":"news-2026-10","found_via":"Found by session web search on 8 Oct 2026; not in the permitted feeds.","older":false,"disposition":"context","reason":"Vendor documentation of the guidelines feature; same origin as the release note."},{"id":"claude-design-ga","url":"https://claude.com/resources/articles/dashboards-and-motion","title":"Build live dashboards and animate explainers with Claude","publisher":"Anthropic","published":"2026-10-08","kind":"vendor-announcement","reading_depth":"full-article","status":"ok","origin":"claude-design-ga-2026-10","batch":"news-2026-10","found_via":"Found by session web search on 8 Oct 2026; not in the permitted feeds.","older":false,"disposition":"used","reason":"Primary announcement for the 8 Oct change; vendor source."},{"id":"figma-coinbase-code-connect","url":"https://www.figma.com/blog/how-coinbase-used-code-connect-to-shrink-token-costs/","title":"How Coinbase used Code Connect to guide agents and shrink token costs","publisher":"Figma (Coinbase case study)","published":"2026-09-02","kind":"case-study","reading_depth":"full-article","status":"ok","origin":"coinbase-code-connect-eval-2026","batch":"news-2026-10","found_via":"Found by session web search on 8 Oct 2026; not in the permitted feeds.","older":false,"disposition":"used","reason":"The only measured design-to-code case found; small and vendor-published."},{"id":"context-files","url":"https://arxiv.org/html/2602.11988v1","title":"Evaluating AGENTS.md","publisher":"Gloaguen et al.","published":"2026-02-12","kind":"research-preprint","reading_depth":"full-paper","status":"ok","origin":"agents-md-evaluation","batch":"expansion","found_via":null,"older":false,"disposition":"used","reason":"Controlled research on instruction files; coding tasks, not design."},{"id":"nng-ux-context","url":"https://www.nngroup.com/articles/ux-context-design/","title":"UX-Context Design: Using UX Knowledge to Inform AI-Generated Design","publisher":"Nielsen Norman Group (Tony Alicea)","published":"2026-07-24","kind":"practitioner-research","reading_depth":"full-article","status":"ok","origin":"nng-ux-context-2026","batch":"news-2026","found_via":null,"older":false,"disposition":"context","reason":"Counterpoint: argues curated context helps, without published data."}],"scan_id":"scan-news-223f86401d12"},"previous":{"name":"ai-news","run_id":"ai-design-01e49afe8e64","created":"2026-10-08T19:17:07.236830+00:00","status":"analyzed","reading":{"sources":16,"words":60689,"paper_words":23485,"minutes":318},"publishers":["Anthropic","CNBC","Designer Fund and Foundation Capital","Dong & Yakura","Eleken","Figma","Gloaguen et al.","Google Labs","Muzli","Nielsen Norman Group","Simon Willison","TechCrunch","Wadinambiarachchi et al."],"question":"What's genuinely changing in AI-native product design, and which connections could improve how I judge and build products?","reads":[{"id":"connection-ae3deb0ca84c411a","key":"ai-first-step-is-now-the-product-default","title":"The new tools put AI at the step where it narrows ideas, and it will feel like an improvement","whats_new":null,"why":"A 'this feels better' check cannot detect this effect for you. The practical lever is order: write or sketch your own directions first, then use Stitch or Claude Design to expand, critique or refine them, instead of accepting its first set as your starting point. This revises the earlier 'protect independent starts' proposal with dated 2026 product evidence and a 2026 study, not the same research restated.","thesis":"Interpretation, not a verified finding. The earlier hypothesis treated where AI enters the workflow as a personal habit. The 2026 launches change that: Stitch (March) and Claude Design (April) are marketed to start from an objective and let AI generate the directions. The newest evidence, a July 2026 preregistered writing experiment, separates two effects: AI-generated ideas compressed collective diversity while raising each writer's own ratings, and AI refining people's own ideas did not show that loss. If this transfers to product design, a designer's sense that AI improves their work, which Figma's survey reports at 91%, is the expected signal rather than a reassurance. The convergence would be visible only across people or projects.","gap":null,"missing":"No study of professional product designers using Stitch or Claude Design. The 2026 experiment measured metaphor writing, not interface design. The 2024 fixation study used novices and image generators and is flagged as possibly outdated. Figma's figure is vendor-published self-report. That collective convergence costs a product team anything, for example differentiation, is an inference.","counter":"The earlier corpus held a 2024 experiment in which dynamically generated AI examples increased collective idea diversity, so the effect depends on how the AI ideas are supplied. Simon Willison and Jenny Wen argue that cheap prototypes let designers explore more directions, and a skilled designer may filter many AI variants well. Vendors claim wider exploration, and the evidence here does not test their tools directly.","next":"On one real brief, make three directions yourself before prompting and three AI-first directions. Ask two or three colleagues to blind-sort them for distinctiveness, and repeat across two designers on the same brief. If the AI-first sets are rated equally distinct and do not converge between designers, this inference weakens.","freshness":"changed-evidence","supersedes":["connection-a4ad67a71f8d1cc6"],"evidence":[{"id":"claim-8aff17c1e9501574","statement":"Google Labs (18 March 2026) presents Stitch's 'vibe design' as starting from a stated objective rather than a wireframe, with AI generating the directions.","quote":"Instead of starting with a wireframe, you can start by explaining the business objective you’re hoping to achieve","kind":"attributed-opinion","event":"stitch-vibe-design-launch","source":{"id":"stitch-vibe-design","url":"https://blog.google/innovation-and-ai/models-and-research/google-labs/stitch-ai-ui-design/","title":"Introducing “vibe design” with Stitch","publisher":"Google Labs","published":"2026-03-18","kind":"vendor-announcement","reading_depth":"full-article","status":"ok","origin":"stitch-vibe-design-2026","batch":"news-2026","found_via":null,"older":false}},{"id":"claim-c8a225a1cee848d3","statement":"Anthropic (17 April 2026) markets Claude Design to designers as a way to generate many exploratory directions quickly.","quote":"Designers can quickly create a wide range of directions to explore.","kind":"attributed-opinion","event":"claude-design-launch","source":{"id":"claude-design-launch","url":"https://www.anthropic.com/news/claude-design-anthropic-labs","title":"Introducing Claude Design by Anthropic Labs","publisher":"Anthropic","published":"2026-04-17","kind":"vendor-announcement","reading_depth":"full-article","status":"ok","origin":"claude-design-launch-2026","batch":"news-2026","found_via":null,"older":false}},{"id":"claim-8d6e27e3276f7e38","statement":"A preregistered creative-writing experiment (preprint, July 2026) reports that AI-generated ideas reduced the collective diversity of what writers produced.","quote":"AI ideation compressed collective diversity for everyone","kind":"reported-finding","event":"human-diversity-preprint-2026","source":{"id":"human-diversity","url":"https://arxiv.org/abs/2607.26899","title":"Human diversity and AI-assisted creativity","publisher":"Dong & Yakura","published":"2026-07-29","kind":"research-preprint","reading_depth":"abstract-only","status":"ok","origin":"human-diversity-2026","batch":"expansion","found_via":null,"older":false}},{"id":"claim-6edfb4a541d3107f","statement":"The same preprint reports that AI ideation raised individual writers' ratings, which the authors describe as private incentives conflicting with the collective good.","quote":"AI ideation raised writers' ratings, pitting private incentives against the collective good","kind":"reported-finding","event":"human-diversity-preprint-2026","source":{"id":"human-diversity","url":"https://arxiv.org/abs/2607.26899","title":"Human diversity and AI-assisted creativity","publisher":"Dong & Yakura","published":"2026-07-29","kind":"research-preprint","reading_depth":"abstract-only","status":"ok","origin":"human-diversity-2026","batch":"expansion","found_via":null,"older":false}},{"id":"claim-25579ee9e20bb187","statement":"In that experiment, AI refining writers' own ideas did not show the same loss of collective diversity.","quote":"whereas AI refinement preserved both","kind":"reported-finding","event":"human-diversity-preprint-2026","source":{"id":"human-diversity","url":"https://arxiv.org/abs/2607.26899","title":"Human diversity and AI-assisted creativity","publisher":"Dong & Yakura","published":"2026-07-29","kind":"research-preprint","reading_depth":"abstract-only","status":"ok","origin":"human-diversity-2026","batch":"expansion","found_via":null,"older":false}},{"id":"claim-c7684d737ed9f9e7","statement":"Figma's commissioned survey of 906 designers (February 2026) reports that 91% say AI tools improve their designs; this is self-report published by a design-tool vendor.","quote":"91% say that new AI tools improve their designs","kind":"reported-finding","event":"figma-state-of-designer-2026","source":{"id":"figma-state-of-designer","url":"https://www.figma.com/blog/state-of-the-designer-2026/","title":"State of the Designer 2026","publisher":"Figma","published":"2026-02-12","kind":"vendor-survey","reading_depth":"publisher-summary","status":"ok","origin":"figma-state-of-designer-2026","batch":"news-2026","found_via":null,"older":false}},{"id":"claim-bc53458cd18c4313","statement":"A 2024 experiment with 60 participants found AI image generation during ideation increased fixation on an initial example. It is older evidence and used here only to test the 2026 claims.","quote":"support from an AI image generator during ideation leads to higher fixation on an initial example","kind":"reported-finding","event":"visual-ideation-fixation","source":{"id":"design-fixation","url":"https://arxiv.org/html/2403.11164v1","title":"AI image generation and design fixation","publisher":"Wadinambiarachchi et al.","published":"2024-03-17","kind":"research-paper","reading_depth":"full-paper","status":"ok","origin":"visual-ideation-fixation","batch":"expansion","found_via":null,"older":true}}],"developments":[],"created":"2026-10-08T19:17:07.236830+00:00"},{"id":"connection-feea5602be496d04","key":"design-context-files-need-a-test","title":"Design context files are becoming a deliverable, but the only controlled test says hand-written ones barely help and generated ones hurt","whats_new":null,"why":"The designer's next high-value asset may be a text file read by every AI tool in the organisation. You already care about asset quality, and this evidence suggests treating that file as a designed artifact with its own evaluation. Keep it short and hand-curated, and compare output with and without it. Do not assume a generated file helps.","thesis":"Interpretation. NN/g (July 2026) proposes 'UX-context design': research and design output becomes curated files that AI tools read, using Google's DESIGN.md (open-sourced April 2026) as a model and suggesting the reasoning can be distilled with AI help. The closest controlled evidence in this packet is a February 2026 evaluation of coding agents. Developer-written context files gave only a marginal gain and LLM-generated ones slightly reduced performance, with higher cost reported. If that pattern carries over to design, the value of a DESIGN.md or UX.md comes from human curation and measurement, and an AI-drafted context file is a risk rather than a shortcut.","gap":null,"missing":"The controlled study measured repository coding tasks, not UI generation. NN/g does not publish the method or data behind its experiments. DESIGN.md is a draft specification. Exact token values such as colours and spacing may behave differently from repository guidance. No packet source measures UI quality with and without a design context file.","counter":"NN/g reports that its own experiments suggest curated context improves AI-generated UI. Design tokens are precise, checkable values, which could make design context more useful than the coding guidance tested. Model and tool changes may alter results quickly.","next":"Generate the same five screens three ways: with no context, with a hand-written DESIGN.md and with an AI-drafted one. Have someone blind-rate fit to the design system and brand. If the AI-drafted file performs as well as the hand-written one, or neither beats no context, revise this.","freshness":"new-to-corpus","supersedes":[],"evidence":[{"id":"claim-8744396762457abf","statement":"Nielsen Norman Group (24 July 2026) says its own experiments suggest curated UX context improves AI-generated UI; the method and data are not described in the article.","quote":"Our experiments suggest that curated UX context improves AI-generated UI","kind":"attributed-opinion","event":"nng-ux-context-design","source":{"id":"nng-ux-context","url":"https://www.nngroup.com/articles/ux-context-design/","title":"UX-Context Design: Using UX Knowledge to Inform AI-Generated Design","publisher":"Nielsen Norman Group (Tony Alicea)","published":"2026-07-24","kind":"practitioner-research","reading_depth":"full-article","status":"ok","origin":"nng-ux-context-2026","batch":"news-2026","found_via":null,"older":false}},{"id":"claim-2bfb427b82a2ddc8","statement":"The same NN/g article suggests the reasoning behind research deliverables can be distilled into context with AI assistance, while also warning that human curation is needed.","quote":"That reasoning can be distilled with AI help.","kind":"attributed-opinion","event":"nng-ux-context-design","source":{"id":"nng-ux-context","url":"https://www.nngroup.com/articles/ux-context-design/","title":"UX-Context Design: Using UX Knowledge to Inform AI-Generated Design","publisher":"Nielsen Norman Group (Tony Alicea)","published":"2026-07-24","kind":"practitioner-research","reading_depth":"full-article","status":"ok","origin":"nng-ux-context-2026","batch":"news-2026","found_via":null,"older":false}},{"id":"claim-d4c7c9f15dda8640","statement":"Google Labs (21 April 2026) open-sourced the draft DESIGN.md specification, claiming it lets AI agents understand the purpose of design tokens.","quote":"AI agents can know exactly what a color is for","kind":"attributed-opinion","event":"design-md-open-spec","source":{"id":"stitch-design-md","url":"https://blog.google/innovation-and-ai/models-and-research/google-labs/stitch-design-md/","title":"Stitch’s DESIGN.md format is now open-source","publisher":"Google Labs","published":"2026-04-21","kind":"vendor-announcement","reading_depth":"short-post","status":"ok","origin":"design-md-open-spec-2026","batch":"news-2026","found_via":null,"older":false}},{"id":"claim-45d96fd22afd57eb","statement":"A February 2026 evaluation of coding agents found developer-written repository context files gave only a marginal performance gain over none.","quote":"developer-provided files only marginally improve performance compared to omitting them entirely","kind":"reported-finding","event":"agents-md-evaluation","source":{"id":"context-files","url":"https://arxiv.org/html/2602.11988v1","title":"Evaluating AGENTS.md","publisher":"Gloaguen et al.","published":"2026-02-12","kind":"research-preprint","reading_depth":"full-paper","status":"ok","origin":"agents-md-evaluation","batch":"expansion","found_via":null,"older":false}},{"id":"claim-adf164b9895db41e","statement":"The same evaluation found LLM-generated context files slightly reduced coding-agent performance.","quote":"LLM-generated context files have a small negative effect on agent performance","kind":"reported-finding","event":"agents-md-evaluation","source":{"id":"context-files","url":"https://arxiv.org/html/2602.11988v1","title":"Evaluating AGENTS.md","publisher":"Gloaguen et al.","published":"2026-02-12","kind":"research-preprint","reading_depth":"full-paper","status":"ok","origin":"agents-md-evaluation","batch":"expansion","found_via":null,"older":false}}],"developments":[],"created":"2026-10-08T19:17:07.236830+00:00"},{"id":"connection-1213b6c2a4574ef1","key":"designers-ship-code-without-debugging-reps","title":"Designers now ship code, and the skill the evidence says erodes first is debugging","whats_new":null,"why":"Design QA now includes whether shipped code behaves correctly, not only whether it looks right. If you lead or mentor, keep unassisted practice on the tasks being automated and keep a review step for designer-shipped changes. This revises the earlier review-capacity proposal with new 2026 evidence about who ships code.","thesis":"Interpretation. The earlier proposal said review capacity depends on retaining the skill to evaluate work. The 2026 reporting changes what designers are reviewing. Half of 900+ surveyed designers say they have pushed AI-generated code to production. Survey respondents and Muzli both say the entry-level tasks where designers built judgment are being compressed, and Simon Willison describes the bottleneck moving to testing. In Anthropic's randomized learning study, AI-assisted learners lost most on debugging. Taken together, designers are taking on a production responsibility through the assistance pattern that, in that study, most weakened the skill needed to catch its errors.","gap":null,"missing":"The randomized study measured developers learning a Python library, not designers. 'Pushed to production' is undefined in the survey and may mostly mean copy or spacing fixes. The survey is self-reported and published by venture investors. No packet source reports defect or revert rates for designer-shipped code.","counter":"The same survey reports that designers using AI coding feel more creative and capable, and some companies keep engineering pull-request review for designer changes. The learning study found outcomes varied with how people used AI. Willison argues cheap prototypes reduce the cost of mistakes.","next":"For one month, compare revert or bug rates of designer-shipped and engineer-shipped UI changes, and ask designers to diagnose a seeded defect in their own recent change without AI. Equal rates and successful diagnosis would weaken this.","freshness":"changed-evidence","supersedes":["connection-bdbd3c23dd4bb02d"],"evidence":[{"id":"claim-7e5b0beb60140fa8","statement":"The AI in Design Report 2026 (survey of 900+ designers, Q1 2026, published by two venture firms) reports half of respondents have pushed AI-generated code to production.","quote":"50% of all respondents have pushed AI-generated code to production","kind":"reported-finding","event":"ai-in-design-report-2026","source":{"id":"state-of-ai-design-craft","url":"https://stateofaidesign.com/chapters/craft","title":"AI in Design Report 2026 — Craft chapter","publisher":"Designer Fund and Foundation Capital","published":"2026-05","kind":"industry-survey","reading_depth":"full-article","status":"ok","origin":"ai-in-design-report-2026","batch":"news-2026","found_via":null,"older":false}},{"id":"claim-057297d6a54ad7f9","statement":"The same report records respondents' worry that outsourcing parts of the process may limit how younger designers develop judgment.","quote":"outsourcing parts of the process may limit how younger designers develop judgment","kind":"attributed-opinion","event":"ai-in-design-report-2026","source":{"id":"state-of-ai-design-craft","url":"https://stateofaidesign.com/chapters/craft","title":"AI in Design Report 2026 — Craft chapter","publisher":"Designer Fund and Foundation Capital","published":"2026-05","kind":"industry-survey","reading_depth":"full-article","status":"ok","origin":"ai-in-design-report-2026","batch":"news-2026","found_via":null,"older":false}},{"id":"claim-1e083664a15ef48c","statement":"Muzli (April 2026) argues the entry-level tasks now compressed by AI, such as wireframing and quick prototyping, were where junior designers built judgment.","quote":"these were the tasks that junior designers used to develop judgment","kind":"attributed-opinion","event":"muzli-vibe-design-2026","source":{"id":"muzli-vibe-design","url":"https://muz.li/blog/vibe-design-in-2026-what-ai-generated-ui-means-for-your-work/","title":"Vibe Design in 2026: What AI-Generated UI Means for Your Work","publisher":"Muzli","published":"2026-04-14","kind":"practitioner-post","reading_depth":"full-article","status":"ok","origin":"muzli-vibe-design-2026","batch":"news-2026","found_via":null,"older":false}},{"id":"claim-8d7d21461e8fb1f1","statement":"Anthropic's randomized study of developers learning a new library (January 2026) found AI-assisted learners scored lower, with the largest gap on debugging questions.","quote":"The largest gap in scores between the two groups was on debugging questions","kind":"reported-finding","event":"anthropic-skills-formation","source":{"id":"skills-formation","url":"https://www.anthropic.com/research/AI-assistance-coding-skills","title":"How AI assistance impacts coding skills","publisher":"Anthropic","published":"2026-01-29","kind":"vendor-research","reading_depth":"full-article","status":"ok","origin":"anthropic-skills-formation","batch":"expansion","found_via":null,"older":false}},{"id":"claim-816eb866b940aa32","statement":"Simon Willison (April 2026) says that with prototypes now cheap, the bottleneck in building software has moved to testing.","quote":"The bottleneck has moved to testing","kind":"attributed-opinion","event":"willison-lenny-2026","source":{"id":"willison-lennys-podcast","url":"https://simonwillison.net/2026/Apr/2/lennys-podcast/","title":"Highlights from my conversation about agentic engineering on Lenny’s Podcast","publisher":"Simon Willison","published":"2026-04-02","kind":"practitioner-post","reading_depth":"full-article","status":"ok","origin":"willison-lenny-2026","batch":"news-2026","found_via":null,"older":false}}],"developments":[],"created":"2026-10-08T19:17:07.236830+00:00"}],"developments":[],"update":null,"summary":"In 2026, AI design tools moved to the start of the design process. Google's Stitch and Anthropic's Claude Design generate directions and interactive prototypes from a description, and Figma links AI-generated code back to its canvas. Surveys report most designers use AI weekly, say it improves their work, and that half have shipped AI-generated code. Practitioners say prototypes are now the expected deliverable and testing is the new bottleneck. NN/g and Google push context files such as DESIGN.md so AI output follows a team's standards. Research is more cautious: AI-supplied ideas can narrow collective diversity, AI-assisted learning weakened debugging, and hand-written context files gave only small gains.","trail":[{"id":"design-fixation","url":"https://arxiv.org/html/2403.11164v1","title":"AI image generation and design fixation","publisher":"Wadinambiarachchi et al.","published":"2024-03-17","kind":"research-paper","reading_depth":"full-paper","status":"ok","origin":"visual-ideation-fixation","batch":"expansion","found_via":null,"older":true,"disposition":"used","reason":"2024 controlled study, flagged may-be-outdated; used only to test the 2026 exploration claims alongside newer evidence."},{"id":"human-diversity","url":"https://arxiv.org/abs/2607.26899","title":"Human diversity and AI-assisted creativity","publisher":"Dong & Yakura","published":"2026-07-29","kind":"research-preprint","reading_depth":"abstract-only","status":"ok","origin":"human-diversity-2026","batch":"expansion","found_via":null,"older":false,"disposition":"used","reason":"July 2026 preregistered preprint separating AI ideation from AI refinement; central to connection 1."},{"id":"skills-formation","url":"https://www.anthropic.com/research/AI-assistance-coding-skills","title":"How AI assistance impacts coding skills","publisher":"Anthropic","published":"2026-01-29","kind":"vendor-research","reading_depth":"full-article","status":"ok","origin":"anthropic-skills-formation","batch":"expansion","found_via":null,"older":false,"disposition":"used","reason":"Randomized learning study; supplies the debugging result for connection 3. Coding learners, not designers."},{"id":"context-files","url":"https://arxiv.org/html/2602.11988v1","title":"Evaluating AGENTS.md","publisher":"Gloaguen et al.","published":"2026-02-12","kind":"research-preprint","reading_depth":"full-paper","status":"ok","origin":"agents-md-evaluation","batch":"expansion","found_via":null,"older":false,"disposition":"used","reason":"Controlled evaluation of repository context files; the only controlled test related to DESIGN.md-style files in this packet."},{"id":"claude-design-launch","url":"https://www.anthropic.com/news/claude-design-anthropic-labs","title":"Introducing Claude Design by Anthropic Labs","publisher":"Anthropic","published":"2026-04-17","kind":"vendor-announcement","reading_depth":"full-article","status":"ok","origin":"claude-design-launch-2026","batch":"news-2026","found_via":null,"older":false,"disposition":"used","reason":"Primary announcement of Claude Design; vendor claim about exploration."},{"id":"techcrunch-claude-design","url":"https://techcrunch.com/2026/04/17/anthropic-launches-claude-design-a-new-product-for-creating-quick-visuals/","title":"Anthropic launches Claude Design, a new product for creating quick visuals","publisher":"TechCrunch","published":"2026-04-17","kind":"tech-news","reading_depth":"full-article","status":"ok","origin":"claude-design-launch-2026","batch":"news-2026","found_via":null,"older":false,"disposition":"duplicate","reason":"Reports the same launch; points to the Anthropic announcement and adds positioning against Canva, not independent confirmation."},{"id":"cnbc-code-to-canvas","url":"https://www.cnbc.com/2026/02/17/figma-anthropic-ai-code-designs.html","title":"Figma partners with Anthropic on AI feature integrating Claude Code","publisher":"CNBC","published":"2026-02-17","kind":"tech-news","reading_depth":"full-article","status":"ok","origin":"figma-code-to-canvas-2026","batch":"news-2026","found_via":null,"older":false,"disposition":"used","reason":"Business reporting on Figma's Code to Canvas; supplies a forecast that refinement could be skipped."},{"id":"stitch-vibe-design","url":"https://blog.google/innovation-and-ai/models-and-research/google-labs/stitch-ai-ui-design/","title":"Introducing “vibe design” with Stitch","publisher":"Google Labs","published":"2026-03-18","kind":"vendor-announcement","reading_depth":"full-article","status":"ok","origin":"stitch-vibe-design-2026","batch":"news-2026","found_via":null,"older":false,"disposition":"used","reason":"Primary announcement that frames AI-generated directions as the starting point."},{"id":"stitch-design-md","url":"https://blog.google/innovation-and-ai/models-and-research/google-labs/stitch-design-md/","title":"Stitch’s DESIGN.md format is now open-source","publisher":"Google Labs","published":"2026-04-21","kind":"vendor-announcement","reading_depth":"short-post","status":"ok","origin":"design-md-open-spec-2026","batch":"news-2026","found_via":null,"older":false,"disposition":"used","reason":"Primary announcement of the open DESIGN.md specification; short post."},{"id":"nng-ux-context","url":"https://www.nngroup.com/articles/ux-context-design/","title":"UX-Context Design: Using UX Knowledge to Inform AI-Generated Design","publisher":"Nielsen Norman Group (Tony Alicea)","published":"2026-07-24","kind":"practitioner-research","reading_depth":"full-article","status":"ok","origin":"nng-ux-context-2026","batch":"news-2026","found_via":null,"older":false,"disposition":"used","reason":"Practitioner-research article proposing context files as the new UX deliverable."},{"id":"state-of-ai-design-craft","url":"https://stateofaidesign.com/chapters/craft","title":"AI in Design Report 2026 — Craft chapter","publisher":"Designer Fund and Foundation Capital","published":"2026-05","kind":"industry-survey","reading_depth":"full-article","status":"ok","origin":"ai-in-design-report-2026","batch":"news-2026","found_via":null,"older":false,"disposition":"used","reason":"Large 2026 designer survey; venture-published, self-reported."},{"id":"figma-state-of-designer","url":"https://www.figma.com/blog/state-of-the-designer-2026/","title":"State of the Designer 2026","publisher":"Figma","published":"2026-02-12","kind":"vendor-survey","reading_depth":"publisher-summary","status":"ok","origin":"figma-state-of-designer-2026","batch":"news-2026","found_via":null,"older":false,"disposition":"used","reason":"Vendor-published survey summary; used as the self-report signal the 2026 study predicts."},{"id":"willison-lennys-podcast","url":"https://simonwillison.net/2026/Apr/2/lennys-podcast/","title":"Highlights from my conversation about agentic engineering on Lenny’s Podcast","publisher":"Simon Willison","published":"2026-04-02","kind":"practitioner-post","reading_depth":"full-article","status":"ok","origin":"willison-lenny-2026","batch":"news-2026","found_via":null,"older":false,"disposition":"used","reason":"Practitioner account that the bottleneck moved to testing."},{"id":"willison-trust-process","url":"https://simonwillison.net/2026/Jan/24/dont-trust-the-process/","title":"Don't “Trust the Process”","publisher":"Simon Willison","published":"2026-01-24","kind":"practitioner-post","reading_depth":"short-post","status":"ok","origin":"jenny-wen-hatch-keynote","batch":"news-2026","found_via":null,"older":false,"disposition":"context","reason":"Relays Jenny Wen's keynote favouring prototypes; used as counterevidence framing, not as a connection claim."},{"id":"muzli-vibe-design","url":"https://muz.li/blog/vibe-design-in-2026-what-ai-generated-ui-means-for-your-work/","title":"Vibe Design in 2026: What AI-Generated UI Means for Your Work","publisher":"Muzli","published":"2026-04-14","kind":"practitioner-post","reading_depth":"full-article","status":"ok","origin":"muzli-vibe-design-2026","batch":"news-2026","found_via":null,"older":false,"disposition":"used","reason":"Practitioner argument that compressed entry-level tasks were where judgment formed."},{"id":"eleken-vibe-design","url":"https://www.eleken.co/blog-posts/vibe-design","title":"Inside Vibe Design: An Agency's Field Guide to Designing with AI in 2026","publisher":"Eleken","published":"2026-07-13","kind":"practitioner-post","reading_depth":"full-article","status":"ok","origin":"eleken-vibe-design-2026","batch":"news-2026","found_via":null,"older":false,"disposition":"context","reason":"Agency field report that clients expect interactive prototypes; background on why AI-first prototyping is spreading."}],"scan_id":null},"replaced":{"connection-ae3deb0ca84c411a":{"title":"The new tools put AI at the step where it narrows ideas, and it will feel like an improvement","thesis":"Interpretation, not a verified finding. The earlier hypothesis treated where AI enters the workflow as a personal habit. The 2026 launches change that: Stitch (March) and Claude Design (April) are marketed to start from an objective and let AI generate the directions. The newest evidence, a July 2026 preregistered writing experiment, separates two effects: AI-generated ideas compressed collective diversity while raising each writer's own ratings, and AI refining people's own ideas did not show that loss. If this transfers to product design, a designer's sense that AI improves their work, which Figma's survey reports at 91%, is the expected signal rather than a reassurance. The convergence would be visible only across people or projects.","created":"2026-10-08T19:17:07.236830+00:00"},"connection-feea5602be496d04":{"title":"Design context files are becoming a deliverable, but the only controlled test says hand-written ones barely help and generated ones hurt","thesis":"Interpretation. NN/g (July 2026) proposes 'UX-context design': research and design output becomes curated files that AI tools read, using Google's DESIGN.md (open-sourced April 2026) as a model and suggesting the reasoning can be distilled with AI help. The closest controlled evidence in this packet is a February 2026 evaluation of coding agents. Developer-written context files gave only a marginal gain and LLM-generated ones slightly reduced performance, with higher cost reported. If that pattern carries over to design, the value of a DESIGN.md or UX.md comes from human curation and measurement, and an AI-drafted context file is a risk rather than a shortcut.","created":"2026-10-08T19:17:07.236830+00:00"},"connection-1213b6c2a4574ef1":{"title":"Designers now ship code, and the skill the evidence says erodes first is debugging","thesis":"Interpretation. The earlier proposal said review capacity depends on retaining the skill to evaluate work. The 2026 reporting changes what designers are reviewing. Half of 900+ surveyed designers say they have pushed AI-generated code to production. Survey respondents and Muzli both say the entry-level tasks where designers built judgment are being compressed, and Simon Willison describes the bottleneck moving to testing. In Anthropic's randomized learning study, AI-assisted learners lost most on debugging. Taken together, designers are taking on a production responsibility through the assistance pattern that, in that study, most weakened the skill needed to catch its errors.","created":"2026-10-08T19:17:07.236830+00:00"}},"scan":{"created":"2026-10-09T02:06:52.423485+00:00","window_days":14,"feeds":[{"publisher":"The Verge","status":"ok","seen":10,"kept":2},{"publisher":"TechCrunch","status":"ok","seen":20,"kept":2},{"publisher":"Wired","status":"ok","seen":10,"kept":0},{"publisher":"Simon Willison's Weblog","status":"ok","seen":30,"kept":1},{"publisher":"Nielsen Norman Group","status":"ok","seen":20,"kept":1},{"publisher":"Google Blog","status":"ok","seen":20,"kept":0},{"publisher":"OpenAI","status":"ok","seen":1258,"kept":1}],"candidates":7,"dropped":{"no_term_match":1320,"outside_window":41}},"lenses":[{"id":"ai-originality","name":"Originality","title":"When does AI make original work more alike?","question":"Which uses of AI widen a designer's exploration, and which quietly make the starting ideas converge?","bridge":"A distinct idea is not necessarily a good one. Investigate whether assisted output also builds the ability to judge it.","next":"ai-judgment","status":"analyzed","created":"2026-10-08T16:52:36.823963+00:00","read_count":10,"source_count":10,"years":["2023","2026"],"reads":[{"id":"connection-81cd655f43930a06","key":"protect-the-starting-point","title":"Your first AI interaction may matter more than your final polishing model","whats_new":null,"why":"Tommy already starts with a strong point of view. This adds a testable distinction: a strong position can still be anchored to the first generated solution. Keep several independently framed problem approaches before showing generated examples, and assess conceptual variety separately from polish.","thesis":"Working hypothesis: preserve independently formed starting directions, then use AI to expand, challenge or refine them. The important variable may be where AI enters the workflow, rather than whether the final artifact uses AI.","gap":null,"missing":"The studies use stories, metaphors and short ideation tasks. They do not establish the best sequence for an experienced product designer or the best current model.","counter":"The dynamic ideation study found more collective diversity under high AI exposure. AI suggestions are not inherently homogenizing; task, exposure pattern, participant expertise and the definition of diversity differ. The fixation sample had little professional experience; the July 2026 result is abstract-only.","next":"On two comparable briefs, compare AI-first ideation with independently framed directions followed by AI refinement. Blind-review both quality and conceptual difference. If AI-first gives equally distinct useful directions, weaken this proposed sequencing rule.","freshness":"new-to-corpus","supersedes":[],"evidence":[{"id":"claim-03a59be3ac9413e0","statement":"Doshi and Hauser report that AI story ideas improved individual writing evaluations, especially for less creative writers, while assisted stories became more similar to one another. This is evidence from story writing, not a design-team outcome.","quote":"GenAI-enabled stories are more similar to each other","kind":"reported-finding","event":"creative-output-convergence","source":{"id":"creativity","url":"https://arxiv.org/abs/2312.00506","title":"Individual creativity and collective diversity","publisher":"Doshi & Hauser","published":"2023-12-01","kind":"research-paper","reading_depth":"abstract-only","status":"ok","origin":"doshi-hauser-creativity","batch":"expansion","found_via":null,"older":true}},{"id":"claim-fc4b44ac8bb6bd45","statement":"A 60-participant visual ideation experiment found higher fixation and fewer, less varied and less original ideas with the tested image generator. Its 20-minute task and largely non-professional sample limit transfer to experienced designers.","quote":"higher fixation on an initial example","kind":"reported-finding","event":"visual-ideation-fixation","source":{"id":"design-fixation","url":"https://arxiv.org/html/2403.11164v1","title":"AI image generation and design fixation","publisher":"Wadinambiarachchi et al.","published":"2024-03-17","kind":"research-paper","reading_depth":"full-paper","status":"ok","origin":"visual-ideation-fixation","batch":"expansion","found_via":null,"older":true}},{"id":"claim-c94f5ba779a1ce2f","statement":"An 800-plus-participant dynamic ideation experiment found that high exposure to AI examples increased collective diversity without improving individual idea creativity. This is credible counterevidence to a universal homogenization claim.","quote":"did increase the average amount and rate of change of collective idea diversity","kind":"reported-finding","event":"dynamic-diversity","source":{"id":"diversity-counterpoint","url":"https://arxiv.org/html/2401.13481v1","title":"AI ideas in a dynamic creative population","publisher":"Ashkinaze et al.","published":"2024-01-24","kind":"research-preprint","reading_depth":"full-paper","status":"ok","origin":"dynamic-ideation-diversity","batch":"expansion","found_via":null,"older":true}},{"id":"claim-1e955d39fada41f1","statement":"Dong and Yakura's July 2026 preprint abstract reports that AI refinement preserved diversity in a metaphor task where AI ideation compressed it; the tested simulated writer pools were less diverse than every human pool. Full methods were not retrieved.","quote":"AI refinement preserved both","kind":"reported-finding","event":"ideation-refinement-personas","source":{"id":"human-diversity","url":"https://arxiv.org/abs/2607.26899","title":"Human diversity and AI-assisted creativity","publisher":"Dong & Yakura","published":"2026-07-29","kind":"research-preprint","reading_depth":"abstract-only","status":"ok","origin":"human-diversity-2026","batch":"expansion","found_via":null,"older":false}}],"developments":[],"created":"2026-10-08T16:52:36.823963+00:00"},{"id":"connection-1766d08141938244","key":"diversity-is-a-workflow-property","title":"Three AI personas are not three independent ways of seeing","whats_new":null,"why":"This directly challenges our own demo: distinct role labels can make one model's output feel socially diverse. Each path must reveal a different unresolved question and source trail. Real community value would require a person to add something the source-only analysis missed.","thesis":"Working hypothesis: a useful borrowed lens should change the evidence or assumptions considered, not merely produce a different voice. Treat our three simulated roles as navigation scaffolding, then test the value of actual contributed reasoning.","gap":null,"missing":"The metaphor experiment does not measure this product or prove that all simulated roles are useless. We have no real contributor comparison and no validated measure of complementary reasoning.","counter":"The P&G experiment shows that AI can supply some measured benefits of collaboration in bounded tasks. The dynamic ideation study also found increased diversity. Neither result establishes authentic interpersonal knowledge exchange; simulation can still help exploration.","next":"Give the same inquiry and sources to a real designer and a practitioner from another field. Compare what their voluntarily shared reasoning adds against the simulated paths. If it only rephrases existing findings, the community claim remains unproven.","freshness":"new-to-corpus","supersedes":[],"evidence":[{"id":"claim-1e955d39fada41f1","statement":"Dong and Yakura's July 2026 preprint abstract reports that AI refinement preserved diversity in a metaphor task where AI ideation compressed it; the tested simulated writer pools were less diverse than every human pool. Full methods were not retrieved.","quote":"AI refinement preserved both","kind":"reported-finding","event":"ideation-refinement-personas","source":{"id":"human-diversity","url":"https://arxiv.org/abs/2607.26899","title":"Human diversity and AI-assisted creativity","publisher":"Dong & Yakura","published":"2026-07-29","kind":"research-preprint","reading_depth":"abstract-only","status":"ok","origin":"human-diversity-2026","batch":"expansion","found_via":null,"older":false}},{"id":"claim-c94f5ba779a1ce2f","statement":"An 800-plus-participant dynamic ideation experiment found that high exposure to AI examples increased collective diversity without improving individual idea creativity. This is credible counterevidence to a universal homogenization claim.","quote":"did increase the average amount and rate of change of collective idea diversity","kind":"reported-finding","event":"dynamic-diversity","source":{"id":"diversity-counterpoint","url":"https://arxiv.org/html/2401.13481v1","title":"AI ideas in a dynamic creative population","publisher":"Ashkinaze et al.","published":"2024-01-24","kind":"research-preprint","reading_depth":"full-paper","status":"ok","origin":"dynamic-ideation-diversity","batch":"expansion","found_via":null,"older":true}},{"id":"claim-63a829c4e1085484","statement":"The Cybernetic Teammate abstract reports that, in a preregistered experiment with 776 P&G professionals, AI-assisted individuals matched unassisted teams on the product-innovation tasks evaluated. It does not establish replacement of enduring team relationships.","quote":"individuals with AI matched the performance of teams without AI","kind":"reported-finding","event":"collaboration-performance","source":{"id":"cybernetic-teammate","url":"https://www.nber.org/papers/w33641","title":"The Cybernetic Teammate","publisher":"NBER / Dell’Acqua et al.","published":"2025-04-01","kind":"working-paper-abstract","reading_depth":"abstract-only","status":"ok","origin":"pg-cybernetic-teammate","batch":"expansion","found_via":null,"older":true}},{"id":"claim-addbdf74b0b7b506","statement":"Anthropic's March 2026 engineering report describes overly positive self-evaluation, especially for subjective design work, and a separately tuned evaluator as a useful intervention rather than a guarantee of impartial judgment.","quote":"Separating the agent doing the work from the agent judging it","kind":"attributed-opinion","event":"external-evaluation","source":{"id":"anthropic-harness","url":"https://www.anthropic.com/engineering/harness-design-long-running-apps","title":"Harness design for long-running application development","publisher":"Anthropic","published":"2026-03-24","kind":"vendor-firsthand","reading_depth":null,"status":"ok","origin":"anthropic-harness-2026","batch":"update","found_via":null,"older":false}}],"developments":[],"created":"2026-10-08T16:52:36.823963+00:00"}]},{"id":"ai-judgment","name":"Judgment","title":"Can better output hide weaker judgment?","question":"How can a designer gain AI-assisted capability while retaining the ability to detect mistakes and evaluate work independently?","bridge":"Personal understanding can disappear into a chat. Investigate which reasoning a team should preserve, revise, or discard.","next":"ai-memory","status":"incomplete","created":"2026-10-08T16:52:36.834067+00:00","read_count":9,"source_count":10,"years":["2025","2026"],"reads":[{"id":"connection-e0d4854af7f3d6d6","key":"measure-retained-judgment","title":"A successful AI-assisted task can conceal a missing ability to check the next one","whats_new":null,"why":"For a designer adopting unfamiliar technical workflows, a polished working result does not reveal whether they can spot the next broken state. A short unassisted critique of a deliberately flawed result could expose an otherwise invisible weakness.","thesis":"Working hypothesis: evaluate what the person can explain, diagnose or reject after assistance, alongside the quality of the delivered work. Output improvement and retained understanding can move differently.","gap":null,"missing":"The randomized evidence concerns mostly junior engineers learning a new library, not senior designers. The confidence and workplace studies are self-reported; session expertise is observational. None establishes inevitable long-term deskilling.","counter":"Some participants used AI to build comprehension, and Anthropic's workplace study also reports accelerated learning. Expertise still predicts useful delegation in its session study. These findings suggest interaction pattern matters, not a blanket ban on assistance.","next":"After a new AI-assisted workflow, hide the assistant and ask the designer to identify a seeded error and explain a design tradeoff. Repeat after a delay. Compare with an explanation-focused workflow; retained detection skill would weaken the concern.","freshness":"new-to-corpus","supersedes":[],"evidence":[{"id":"claim-37cbfd951c3ce9c0","statement":"Anthropic's randomized study of 52 mostly junior engineers learning Trio reports a 50% average post-task quiz score with AI versus 67% without. The overall completion-time difference was not statistically significant; the largest quiz gap concerned debugging.","quote":"the AI group averaged 50% on the quiz","kind":"reported-finding","event":"assistance-and-learning","source":{"id":"skills-formation","url":"https://www.anthropic.com/research/AI-assistance-coding-skills","title":"How AI assistance impacts coding skills","publisher":"Anthropic","published":"2026-01-29","kind":"vendor-research","reading_depth":"full-article","status":"ok","origin":"anthropic-skills-formation","batch":"expansion","found_via":null,"older":false}},{"id":"claim-c288e8850c0c6d42","statement":"A CHI 2025 survey of 319 knowledge workers found an association between greater confidence in AI and less self-reported critical-thinking effort. This is self-report and association, not a causal demonstration of skill loss.","quote":"higher confidence in GenAI is associated with less critical thinking","kind":"reported-finding","event":"confidence-and-effort","source":{"id":"critical-thinking","url":"https://www.microsoft.com/en-us/research/publication/the-impact-of-generative-ai-on-critical-thinking-self-reported-reductions-in-cognitive-effort-and-confidence-effects-from-a-survey-of-knowledge-workers/","title":"Critical thinking in AI-assisted knowledge work","publisher":"Microsoft Research and collaborators","published":"2025-04-01","kind":"research-abstract","reading_depth":"abstract-only","status":"ok","origin":"critical-thinking-survey-2025","batch":"expansion","found_via":null,"older":true}},{"id":"claim-8b796bae0bc44f84","statement":"Anthropic's observational analysis of roughly 400,000 Claude Code sessions reports that greater inferred domain expertise was associated with more work per instruction and a higher likelihood of session success. Occupation is not equivalent to task expertise; this is not a randomized training study.","quote":"The greater domain expertise a person brings to a session","kind":"reported-finding","event":"expertise-and-delegation","source":{"id":"coding-expertise","url":"https://www.anthropic.com/research/claude-code-expertise","title":"How Claude Code changes the value of expertise","publisher":"Anthropic","published":null,"kind":"vendor-research","reading_depth":"full-article","status":"ok","origin":"anthropic-coding-expertise","batch":"expansion","found_via":null,"older":false}},{"id":"claim-96ae1924dec6e286","statement":"Anthropic's December 2025 study of its own engineers and researchers reports expanded capability alongside concerns about technical competence and reduced collaboration with colleagues. These are vendor-employee observations and self-reports, not a causal finding across workplaces.","quote":"more AI collaboration meant they collaborated less with colleagues","kind":"reported-finding","event":"work-and-colleagues","source":{"id":"anthropic-work","url":"https://www.anthropic.com/research/how-ai-is-transforming-work-at-anthropic","title":"How AI is transforming work at Anthropic","publisher":"Anthropic","published":"2025-12-02","kind":"vendor-research","reading_depth":"full-article","status":"ok","origin":"anthropic-work-survey","batch":"expansion","found_via":null,"older":false}}],"developments":[],"created":"2026-10-08T16:52:36.834067+00:00"},{"id":"connection-ba1409fa8e28b1fe","key":"define-the-win-before-delegating","title":"Faster, accepted, and understood are three different outcomes","whats_new":null,"why":"A team could complete more tasks while silently adding review burden or relying on the generator to approve itself. A broad productivity claim is less useful than naming the unit of work and who judges the outcome.","thesis":"Working hypothesis: define success before delegation on three axes—time and review effort, independently accepted output, and retained ability to evaluate it. A single productivity score can hide a failure on another axis.","gap":null,"missing":"These sources do not provide a validated combined score. Review burden and retained understanding must be measured locally; coding and product-innovation task results do not transfer automatically to design.","counter":"METR explicitly warns that its older slowdown result should not be generalized and its later estimates suffer selection bias. P&G shows genuine task-performance benefits. A separate AI evaluator can still share biases with its generator.","next":"For one real task, log elapsed time, human review time and rejected drafts; have an independent reviewer apply criteria written beforehand; then check whether the maker can diagnose one flaw unaided. Keep these measures separate rather than averaging away tradeoffs.","freshness":"new-to-corpus","supersedes":[],"evidence":[{"id":"claim-586e3b6c5141d463","statement":"METR's early-2025 experiment found experienced developers took longer with the tested AI tools in familiar repositories. This bounded result should not be generalized to current tools or all design work.","quote":"they take 19% longer","kind":"reported-finding","event":"experienced-developer-trial","source":{"id":"metr-2025","url":"https://metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/","title":"Early-2025 AI and experienced developer productivity","publisher":"METR","published":"2025-07-10","kind":"primary-research","reading_depth":null,"status":"ok","origin":"metr-productivity-2025","batch":"baseline","found_via":null,"older":true}},{"id":"claim-fde2514e5a7b39cb","statement":"METR's February 2026 update identifies selection effects and unreliable per-task time measurement when developers use agents concurrently; it calls its newer data weak evidence for the size of speedup.","quote":"our data is only very weak evidence","kind":"reported-finding","event":"measurement-update","source":{"id":"metr-update","url":"https://metr.org/blog/2026-02-24-uplift-update/","title":"METR changes its productivity experiment design","publisher":"METR","published":"2026-02-24","kind":"primary-research","reading_depth":null,"status":"ok","origin":"metr-productivity-update-2026","batch":"update","found_via":null,"older":false}},{"id":"claim-5418b4e35753ae2b","statement":"Anthropic's March 2026 engineering report describes overly positive self-evaluation, especially for subjective design work, and a separately tuned evaluator as a useful intervention rather than a guarantee of impartial judgment.","quote":"Separating the agent doing the work from the agent judging it","kind":"attributed-opinion","event":"external-evaluation","source":{"id":"anthropic-harness","url":"https://www.anthropic.com/engineering/harness-design-long-running-apps","title":"Harness design for long-running application development","publisher":"Anthropic","published":"2026-03-24","kind":"vendor-firsthand","reading_depth":null,"status":"ok","origin":"anthropic-harness-2026","batch":"update","found_via":null,"older":false}},{"id":"claim-bd8c83d944ecf032","statement":"Anthropic's evaluation guidance distinguishes capability tests of new abilities from regression tests guarding retained behavior, and recommends evaluating both as a system improves.","quote":"They protect against backsliding","kind":"attributed-opinion","event":"regression-and-capability","source":{"id":"anthropic-evals","url":"https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents","title":"Demystifying evals for AI agents","publisher":"Anthropic","published":"2026-01-09","kind":"vendor-firsthand","reading_depth":null,"status":"ok","origin":"anthropic-evals-2026","batch":"baseline","found_via":null,"older":false}},{"id":"claim-92f9e1b0ce232918","statement":"The Cybernetic Teammate abstract reports that, in a preregistered experiment with 776 P&G professionals, AI-assisted individuals matched unassisted teams on the product-innovation tasks evaluated. It does not establish replacement of enduring team relationships.","quote":"individuals with AI matched the performance of teams without AI","kind":"reported-finding","event":"collaboration-performance","source":{"id":"cybernetic-teammate","url":"https://www.nber.org/papers/w33641","title":"The Cybernetic Teammate","publisher":"NBER / Dell’Acqua et al.","published":"2025-04-01","kind":"working-paper-abstract","reading_depth":"abstract-only","status":"ok","origin":"pg-cybernetic-teammate","batch":"expansion","found_via":null,"older":true}}],"developments":[],"created":"2026-10-08T16:52:36.834067+00:00"}]},{"id":"ai-memory","name":"Shared memory","title":"What should an AI team remember—and forget?","question":"When does shared AI context preserve useful judgment, and when does it spread stale assumptions or unnecessary instructions?","bridge":"Shared context can coordinate a team, but can it also make everyone start from the same ideas? Revisit originality.","next":"ai-originality","status":"analyzed","created":"2026-10-08T16:52:36.841485+00:00","read_count":10,"source_count":10,"years":["2024","2026"],"reads":[{"id":"connection-92317b4ce3c3b348","key":"remember-why-until-when","title":"A useful brain needs a revision trail, not just more remembered text","whats_new":null,"why":"For this product, 'the user explored this claim' must stay separate from 'the user accepted it'. For a design team, a rejected idea or expired assumption should remain inspectable without continuing to steer every new task.","thesis":"Working hypothesis: preserve a decision's owner, evidence, scope and replacement history, then retrieve the relevant parts for the current inquiry. Treat remembered reasoning as revisable context rather than permanent instruction.","gap":null,"missing":"The evidence concerns coding context files and conversational-memory benchmarks. It does not establish that our Obsidian graph improves real news discovery or team decisions. Explicit versions help inspectability but are not a demonstrated cure for model reasoning errors.","counter":"The AGENTS.md paper's detailed conclusion distinguishes a marginal gain from human-written files from a marginal loss with generated files. Useful context can help. Anthropic also warns that excessive compression loses necessary detail; simply storing less is not the answer.","next":"Change one previously accepted premise, record what replaces it, and ask a fresh inquiry that depends on that change. Check whether the agent uses the current premise, can show the old reasoning, and abstains when the new source does not settle the question.","freshness":"new-to-corpus","supersedes":[],"evidence":[{"id":"claim-63dba699be680f2a","statement":"Anthropic's engineering guidance advocates a small, high-signal context and selective compaction; it also warns that aggressive compaction can discard information needed later. This is practitioner guidance, not independent experimental proof.","quote":"smallest possible set of high-signal tokens","kind":"attributed-opinion","event":"selective-context","source":{"id":"context-engineering","url":"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents","title":"Effective context engineering for AI agents","publisher":"Anthropic","published":"2025-09-29","kind":"vendor-firsthand","reading_depth":"full-article","status":"ok","origin":"anthropic-context-engineering","batch":"expansion","found_via":null,"older":true}},{"id":"claim-92209d4f540a1c18","statement":"In the evaluated coding benchmarks, the AGENTS.md paper reports marginally worse task success with generated context files and a marginal gain with developer-written files, with more steps and higher costs. Its largely Python task-resolution setting does not measure all benefits of organizational memory.","quote":"developer-written ones provide a marginal performance gain","kind":"reported-finding","event":"context-file-effects","source":{"id":"context-files","url":"https://arxiv.org/html/2602.11988v1","title":"Evaluating AGENTS.md","publisher":"Gloaguen et al.","published":"2026-02-12","kind":"research-preprint","reading_depth":"full-paper","status":"ok","origin":"agents-md-evaluation","batch":"expansion","found_via":null,"older":false}},{"id":"claim-5c6cf1acddcca3ea","statement":"LongMemEval evaluates information extraction, multi-session reasoning, temporal reasoning, knowledge updates and abstention. Its design treats remembering a changed answer and declining an unsupported answer as distinct abilities; reported model results concern its historical evaluation setting.","quote":"temporal reasoning, knowledge updates, and abstention","kind":"reported-finding","event":"memory-update-evaluation","source":{"id":"longmemeval","url":"https://arxiv.org/html/2410.10813v1","title":"LongMemEval","publisher":"Wu et al.","published":"2024-10-14","kind":"research-paper","reading_depth":"full-paper","status":"ok","origin":"longmemeval","batch":"expansion","found_via":null,"older":true}},{"id":"claim-c7f530453eb1cd4b","statement":"EverMemBench's abstract describes a multi-party memory benchmark with evolving decisions, and reports failures in temporal reasoning without explicit version semantics. This is a benchmark result, not proof that a particular memory architecture solves workplace knowledge.","quote":"temporal reasoning fails without explicit version semantics beyond timestamps","kind":"reported-finding","event":"versioned-collaborative-memory","source":{"id":"evermembench","url":"https://arxiv.org/abs/2602.01313","title":"Evaluating Long-Horizon Memory for Multi-Party Collaborative Dialogues","publisher":"Hu et al.","published":"2026-02-01","kind":"research-preprint","reading_depth":"abstract-only","status":"ok","origin":"evermembench","batch":"expansion","found_via":null,"older":false}}],"developments":[],"created":"2026-10-08T16:52:36.841485+00:00"},{"id":"connection-8d54624eabc19011","key":"test-memory-with-change","title":"A perfect replay can demonstrate the product while hiding whether its memory works","whats_new":null,"why":"The saved paths make the demo reliable. They cannot prove that the product adapts to a new person or preserves another person's meaning. The live moment should introduce a specific uncertainty or correction and show what changed relative to the saved state.","thesis":"Working hypothesis: keep replay for explaining a completed investigation, but evaluate living understanding by changing a question, correcting evidence, or adding a real person's reasoning and observing the next result.","gap":null,"missing":"AMemGym itself uses simulated users. No benchmark cited here validates our proposed community or makes a scripted correction equivalent to longitudinal use. We have not observed real social exchange.","counter":"Static records remain valuable for traceability, reproducible inspection and regression checks. Dynamic tests can also be engineered to pass. A complementary real contributor could fail to add value, which must remain a possible result.","next":"Replay one path offline, then run the same inquiry with an explicit correction or borrowed lens. Inspect the evidence-level difference and whether unsupported material is suppressed. Later repeat with a real, consenting contributor; do not count the simulation as that test.","freshness":"new-to-corpus","supersedes":[],"evidence":[{"id":"claim-82ce40c69ef6139f","statement":"AMemGym argues that static, off-policy conversation histories limit memory evaluation and proposes interactive evaluation with structured evolving user states. Its users are simulated, so it does not establish real community value.","quote":"Existing memory benchmarks rely on static, off-policy data","kind":"reported-finding","event":"interactive-memory-evaluation","source":{"id":"amemgym","url":"https://arxiv.org/abs/2603.01966","title":"AMemGym: Interactive Memory Benchmarking","publisher":"Cheng Jiayang et al.","published":"2026-03-02","kind":"research-paper","reading_depth":"abstract-only","status":"ok","origin":"amemgym","batch":"expansion","found_via":null,"older":false}},{"id":"claim-5c6cf1acddcca3ea","statement":"LongMemEval evaluates information extraction, multi-session reasoning, temporal reasoning, knowledge updates and abstention. Its design treats remembering a changed answer and declining an unsupported answer as distinct abilities; reported model results concern its historical evaluation setting.","quote":"temporal reasoning, knowledge updates, and abstention","kind":"reported-finding","event":"memory-update-evaluation","source":{"id":"longmemeval","url":"https://arxiv.org/html/2410.10813v1","title":"LongMemEval","publisher":"Wu et al.","published":"2024-10-14","kind":"research-paper","reading_depth":"full-paper","status":"ok","origin":"longmemeval","batch":"expansion","found_via":null,"older":true}},{"id":"claim-c7f530453eb1cd4b","statement":"EverMemBench's abstract describes a multi-party memory benchmark with evolving decisions, and reports failures in temporal reasoning without explicit version semantics. This is a benchmark result, not proof that a particular memory architecture solves workplace knowledge.","quote":"temporal reasoning fails without explicit version semantics beyond timestamps","kind":"reported-finding","event":"versioned-collaborative-memory","source":{"id":"evermembench","url":"https://arxiv.org/abs/2602.01313","title":"Evaluating Long-Horizon Memory for Multi-Party Collaborative Dialogues","publisher":"Hu et al.","published":"2026-02-01","kind":"research-preprint","reading_depth":"abstract-only","status":"ok","origin":"evermembench","batch":"expansion","found_via":null,"older":false}},{"id":"claim-228effe1a4a5f318","statement":"Anthropic's December 2025 study of its own engineers and researchers reports expanded capability alongside concerns about technical competence and reduced collaboration with colleagues. These are vendor-employee observations and self-reports, not a causal finding across workplaces.","quote":"more AI collaboration meant they collaborated less with colleagues","kind":"reported-finding","event":"work-and-colleagues","source":{"id":"anthropic-work","url":"https://www.anthropic.com/research/how-ai-is-transforming-work-at-anthropic","title":"How AI is transforming work at Anthropic","publisher":"Anthropic","published":"2025-12-02","kind":"vendor-research","reading_depth":"full-article","status":"ok","origin":"anthropic-work-survey","batch":"expansion","found_via":null,"older":false}},{"id":"claim-50ffa035bcffac66","statement":"Dong and Yakura's July 2026 preprint abstract reports that AI refinement preserved diversity in a metaphor task where AI ideation compressed it; the tested simulated writer pools were less diverse than every human pool. Full methods were not retrieved.","quote":"AI refinement preserved both","kind":"reported-finding","event":"ideation-refinement-personas","source":{"id":"human-diversity","url":"https://arxiv.org/abs/2607.26899","title":"Human diversity and AI-assisted creativity","publisher":"Dong & Yakura","published":"2026-07-29","kind":"research-preprint","reading_depth":"abstract-only","status":"ok","origin":"human-diversity-2026","batch":"expansion","found_via":null,"older":false}}],"developments":[],"created":"2026-10-08T16:52:36.841485+00:00"}]}],"posts":{"label":"Simulated post — not a real statement by Meng To","name":"Meng To","by_read":{"ai-first-step-is-now-the-product-default":{"text":"Started a brief by letting the AI pitch the first directions. They looked great. Then read the July study: AI-supplied ideas made people's work more alike, while each person rated their own work higher. Back to sketching my own three first.","reacts_to":["human-diversity","stitch-vibe-design"]},"design-context-files-need-a-test":{"text":"Everyone is writing DESIGN.md files now. The question nobody answers: did the output actually get better? In the coding-agent study, hand-written context files barely helped and generated ones made things slightly worse.","reacts_to":["context-files","nng-ux-context"]},"designers-ship-code-without-debugging-reps":{"text":"Half of designers in the AI in Design survey say they've pushed AI-generated code to production. Cool. Can we debug it? In Anthropic's learning study, the biggest gap for AI-assisted learners was debugging.","reacts_to":["state-of-ai-design-craft","skills-formation"]}}}};

    canvas._field = f;

      c.width = f.cols; c.height = f.rows;

      else if (f.role === 'hero') f.cell = TOK.pixel;
      else if (f.role === 'thumb') f.cell = Math.max(1, TOK.pixel - 1);

/* Stage: sparse drifting noise; the pointer opens a rippling lens of signal. */

    prepare(t, f) {

/* 1a · Ask: a small living cluster. It breathes at rest, wakes when you speak and throws off a dot or two with each word. */

    prepare(t, f, now) {

      const breathe = 1 + .06 * Math.sin(t * 1.25) + st.e * .16, pull = 1 - st.gather;
      const gap = (15 + 2.5 * Math.sin(t * .9) + st.e * 5) * pull, sway = 2.2 * Math.sin(t * .7) + st.e * 3 * Math.sin(t * 5);

        .concat(st.born.map(b => ({ x: b.x * pull, y: b.y * pull, r: b.r * Math.min(1, b.life * 2.5) })));

    value(x, y, t, f) {

/* 1a · Thinking. Claims behind the first update, with their sources: what a cluster reads out when you touch it. */
const WORLD_LABELS = (() => {
  const seen = new Set(), out = [], lists = PREV.reads.map(r => r.evidence.slice());
  while (out.length < 7 && lists.some(l => l.length)) lists.forEach(l => {
    const e = l.shift();
    if (!e || seen.has(e.source.publisher) || out.length >= 7) return;
    seen.add(e.source.publisher);
    let t = claimText(e);
    if (t.length > 96) t = t.slice(0, t.lastIndexOf(' ', 92)) + '…';
    out.push({ k: e.source.publisher.split(' (')[0] + ' · ' + fmtShort(e.source.published), t });
  });

  const place = a => {

    let x = a.x + r + 10, y = a.y - lh / 2;

/* ======================= Transitions ======================= */
/* Forward/back: a dithered band sweeps across. Old and new screens are cut from complementary Bayer tiles, so at every
   pixel exactly one of them shows (the new screen's mask alone does it: it covers the old one); a few signal pixels
   spark on the leading edge. Jumps dissolve the whole screen at once. */
const fringe = document.getElementById('fringe');
const Transition = (() => {
  let active = null;
  const C = 32, N = 6, B = C * N;
  // Sparks: sparse random cells on a tall tile, so the repeat is not visible on screen.
  const SPARK = Array.from({ length: 8 }, (_, k) => {
    const r = rng(k + 11); let d = '';
    for (let y = 0; y < 64; y++) for (let x = 0; x < 8; x++) if (r() < .045) d += 'M' + x * 4 + ' ' + y * 4 + 'h4v4h-4z';
    return 'url("data:image/svg+xml,' + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='32' height='256' shape-rendering='crispEdges'><path d='" + (d || 'M0 0') + "'/></svg>") + '")';
  });
  function finish() {
    if (!active) return;
    const a = active; active = null;
    cancelAnimationFrame(a.raf);
    a.old.parentNode.remove();
    const wrap = a.view.parentNode;
    clearMask(wrap); clearMask(a.view);
    Object.assign(wrap.style, { zIndex: '', width: '', right: '', transform: '', willChange: '' });
    Object.assign(a.view.style, { width: '', right: '', transform: '', willChange: '' });
    if (a.spark) a.spark.remove();
    clearMask(fringe); fringe.style.opacity = 0;
  }
  function run(old, view, mode) {
    finish();
    if (!old) return;
    // 'cut': the old screen has already emptied itself (Thinking's field leaves first), so the new one simply enters.

  if (!target) return;

  const pad = () => currentView && currentView.firstChild;
  const follow = dx => {
    const p = pad(); if (!p) return;
    p.style.willChange = dx ? 'transform' : '';
    p.style.transform = dx ? 'translateX(' + (dx * .45).toFixed(1) + 'px)' : '';
  };
  const settle = () => {
    const p = pad(); if (!p || !p.style.transform) { if (p) p.style.willChange = ''; return; }
    const from = p.style.transform; p.style.transform = '';
    if (calm()) { p.style.willChange = ''; return; }
    p.animate([{ transform: from }, { transform: 'none' }], { duration: 380, easing: EASE_OUT }).onfinish = () => { p.style.willChange = ''; };
  };
  const travel = dir => dir > 0 ? back() : forward();
  // One gesture, whatever the input: start, move (returns true once it has claimed the gesture), end.
  let g = null;
  const start = (x, y) => { g = (can(1) || can(-1)) ? { x, y, t: performance.now(), dir: 0, vx: 0, lx: x, lt: performance.now() } : null; };
  const move = (x, y) => {
    if (!g) return false;
    const dx = x - g.x, dy = y - g.y, now = performance.now();
    if (g.dir === 0) {
      if (Math.hypot(dx, dy) < 8) return false;
      g.dir = Math.abs(dx) > Math.abs(dy) && can(Math.sign(dx)) ? Math.sign(dx) : null;
      if (g.dir) getSelection().removeAllRanges();
    }
    if (!g.dir) return false;
    if (now > g.lt) { g.vx = g.vx * .5 + (x - g.lx) / (now - g.lt) * .5; g.lx = x; g.lt = now; }
    follow(g.dir > 0 ? Math.max(0, dx) : Math.min(0, dx));
    return true;
  };
  const end = x => {
    if (!g) return false;
    const dir = g.dir, dx = (x - g.x) * (dir || 0), flick = g.vx * (dir || 0) > .35 && dx > 24;
    g = null;
    if (!dir) return false;
    if (dx > 64 || flick) travel(dir); else settle();
    return true;
  };
  viewport.addEventListener('touchstart', e => { if (e.touches.length === 1) start(e.touches[0].clientX, e.touches[0].clientY); else g = null; }, { passive: true });
  viewport.addEventListener('touchmove', e => { if (g && e.touches.length === 1 && move(e.touches[0].clientX, e.touches[0].clientY) && e.cancelable) e.preventDefault(); }, { passive: false });
  viewport.addEventListener('touchend', e => { end(e.changedTouches[0].clientX); }, { passive: true });
  viewport.addEventListener('touchcancel', () => { if (g && g.dir) settle(); g = null; }, { passive: true });
  // Mouse and pen.
  let pid = null;
  viewport.addEventListener('pointerdown', e => { if (e.pointerType === 'touch' || e.button > 0) return; pid = e.pointerId; start(e.clientX, e.clientY); });
  viewport.addEventListener('pointermove', e => {
    if (e.pointerId !== pid) return;
    const was = g && g.dir;
    if (move(e.clientX, e.clientY) && !was) { try { viewport.setPointerCapture(pid); } catch (err) {} }
  });
  const pend = e => {
    if (e.pointerId !== pid) return;
    pid = null;
    if (end(e.clientX)) {
      const stop = ev => { ev.stopPropagation(); ev.preventDefault(); };
      viewport.addEventListener('click', stop, { capture: true, once: true });
      setTimeout(() => viewport.removeEventListener('click', stop, { capture: true }), 350);
    }
  };
  viewport.addEventListener('pointerup', pend);
  viewport.addEventListener('pointercancel', e => { if (e.pointerId === pid) { pid = null; if (g && g.dir) settle(); g = null; } });
  // Trackpad: content follows the fingers, so a swipe right (back) arrives as negative deltaX.
  let acc = 0, lock = 0, idle = 0;
  viewport.addEventListener('wheel', e => {
    if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
    const dir = -Math.sign(acc + e.deltaX) || -Math.sign(e.deltaX);
    if (!can(dir)) return;
    e.preventDefault();
    const now = performance.now();
    if (now < lock) return;
    acc += e.deltaX;
    follow(-acc);
    clearTimeout(idle); idle = setTimeout(() => { acc = 0; settle(); }, 160);
    if (Math.abs(acc) > 110) { acc = 0; clearTimeout(idle); lock = now + 800; travel(dir); }
  }, { passive: false });
})();

/* ---------- TEMPORARY: touch indicator ---------- */
/* Shows each finger as a soft grey circle, for screen recordings. Touch events, so it keeps following while a page
   scrolls; mouse and pen are ignored. Set SHOW_TOUCHES to false (or delete this block and .touch-dot) to remove it. */
const SHOW_TOUCHES = true;
if (SHOW_TOUCHES) (() => {
  const dots = new Map();
  const put = (dot, t) => { dot.style.transform = 'translate(' + t.clientX + 'px,' + t.clientY + 'px)'; };
  addEventListener('touchstart', e => {
    for (const t of e.changedTouches) {
      const dot = h('div', { class: 'touch-dot', 'aria-hidden': 'true' });
      put(dot, t); document.body.appendChild(dot); dots.set(t.identifier, dot);
      dot.animate([{ opacity: 0, scale: .6 }, { opacity: 1, scale: 1 }], { duration: 120, easing: EASE_OUT });
    }
  }, { passive: true, capture: true });
  addEventListener('touchmove', e => { for (const t of e.changedTouches) { const dot = dots.get(t.identifier); if (dot) put(dot, t); } }, { passive: true, capture: true });
  const lift = e => {
    for (const t of e.changedTouches) {
      const dot = dots.get(t.identifier); if (!dot) continue;
      dots.delete(t.identifier);
      dot.animate([{ opacity: 1, scale: 1 }, { opacity: 0, scale: 1.25 }], { duration: 260, easing: EASE_OUT, fill: 'forwards' }).onfinish = () => dot.remove();
    }
  };
  addEventListener('touchend', lift, { passive: true, capture: true });
  addEventListener('touchcancel', lift, { passive: true, capture: true });
})();

/* ---------- design studio bridge ---------- */
/* Inside the studio's Stage, tokens arrive live, and a moved motion knob asks for a short demonstration of what it times.
   Opened on its own, the page never hears from a parent and runs on the inlined tokens. */
const inStudio = window.parent !== window;
const effectiveTheme = () => root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
/* The browser chrome and the phone's status bar wear the app's background, in either theme. */
function syncStatusBar() { document.getElementById('themeColor').content = getComputedStyle(root).getPropertyValue('--screen').trim(); }
function announceTheme() { syncStatusBar(); if (inStudio) parent.postMessage({ type: 'nexgen:theme', theme: effectiveTheme() }, '*'); }
function tokensChanged() { readTokens(); DITHER.refresh(); deviceShadow(); displayKind(); loadFonts(); PAL = null; Fields.retune(); syncStatusBar(); }
syncStatusBar();
function pulse(el) { if (!el) return; el.classList.add('is-hover'); setTimeout(() => el.classList.remove('is-hover'), 1100); }
function firstVisible(selector) {
  const v = viewport.getBoundingClientRect();
  return [...document.querySelectorAll(selector)].find(el => { const r = el.getBoundingClientRect(); return r.height && r.bottom > v.top && r.top < v.bottom; });
}
const PREVIEW = {
  durMicro: () => pulse(firstVisible('.view .fb .actions button, .view .btn:not(.quiet)') || bar.querySelector('.link')),
  durMove: () => pulse(firstVisible('.view button.file:not(.in-drawer), .view button.file.current')),
  durReveal: () => {
    const b = firstVisible('.view .acc > button');
    if (b) { b.click(); setTimeout(() => b.isConnected && b.click(), 1600 * TOK.k.reveal); return; }
    if (!strip.classList.contains('shut')) { strip.classList.add('shut'); setTimeout(drawStrip, TOK.reveal + 80); return; }
    pulse(firstVisible('.view .btn:not(.quiet)'));
  },
  durScreen: () => render('forward'),
  durDevelop: () => choreograph(currentView, 'jump'),
  durDecode: () => choreograph(currentView, 'jump'),
  glitch: () => glitch(device),
  introHold: () => bootSequence(() => enterScreen(currentView, 'jump')),
  checkDuration: () => { if (S.act === 1) runCheck('first'); },
};
addEventListener('message', e => {
  if (!inStudio || e.source !== parent || !e.data) return;
  if (e.data.type === 'nexgen:tokens' && typeof e.data.css === 'string') { document.getElementById('tokens').textContent = e.data.css; tokensChanged(); }
  if (e.data.type === 'nexgen:preview' && PREVIEW[e.data.token]) PREVIEW[e.data.token]();
});

/* ---------- start ---------- */
stageField();
drawTools();
S.stack = [['ask']];
render(calm() ? 'jump' : 'silent');
bootSequence(() => enterScreen(currentView, 'jump'));
if (inStudio) parent.postMessage({ type: 'nexgen:ready', theme: effectiveTheme() }, '*');
</script>
</body>
